<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="干死狗庄">
<meta name="theme-color" content="#f5f5f7">
<title>干死狗庄</title>
<!-- 图标：红色底 + 白色「股」字。
     注意：iOS 加到主屏幕时**不认 SVG**，只认 PNG，所以必须用真实文件。
     主屏图标还要是满底色的（iOS 自己裁圆角），透明的话四角会发黑。 -->
<link rel="icon" type="image/png" sizes="32x32" href="appicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="appicon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="appicon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="appicon-512.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    color-scheme: light dark;
    --bg:#f5f5f7; --card:#fff; --fg:#1c1c1e; --sub:#8a8a8e;
    --line:#e6e6ea; --accent:#d92b2b; --blue:#0a84ff; --danger:#ff3b30; --ok:#30a350;
    --field:#f0f0f3; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --card:#1c1c1e; --fg:#fff; --sub:#98989d; --line:#2c2c2e;
           --field:#2c2c2e; --shadow:none; --accent:#ff453a; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 40px);
    max-width:1180px;margin:0 auto;
  }

  /* 顶部：图标和副标题并排对齐（不显示软件名，名字只在主屏图标和网页标题上） */
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .logo{width:40px;height:40px;flex-shrink:0}
  .lead{color:var(--sub);font-size:12.5px;line-height:1.45}

  /* 双栏 */
  .cols{display:block;max-width:720px;margin:0 auto}
  @media (max-width:860px){ .cols{grid-template-columns:1fr} }
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .col-title{
    font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.5px;
    padding:0 2px 2px;display:flex;align-items:center;gap:6px;
  }
  .col-title .bar{width:3px;height:14px;background:var(--accent);border-radius:2px}

  .card{background:var(--card);border-radius:14px;padding:15px;box-shadow:var(--shadow)}
  .card h2{font-size:15.5px;margin:0 0 3px;display:flex;align-items:center;gap:6px}
  .card h2 .n{
    background:var(--accent);color:#fff;width:19px;height:19px;border-radius:50%;
    font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .hint{color:var(--sub);font-size:12px;margin-bottom:11px;line-height:1.5}

  label{display:block;font-size:12px;color:var(--sub);margin:12px 0 6px;font-weight:500}
  input,select,textarea{
    width:100%;padding:12px 13px;font-size:16px;font-family:inherit;
    background:var(--field);color:var(--fg);
    border:1.5px solid transparent;border-radius:11px;outline:none;
    -webkit-appearance:none;appearance:none;
  }
  textarea{resize:vertical;min-height:96px;line-height:1.55;font-size:15px}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--card)}
  input::placeholder,textarea::placeholder{color:var(--sub)}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
    background-position:calc(100% - 18px) 51%,calc(100% - 13px) 51%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
  .row{display:flex;gap:9px}
  .row>*{flex:1;min-width:0}

  /* 窄屏：让弹性行自动换行，避免按钮被挤出屏幕 */
  @media (max-width:560px){
    .card{padding:13px}
    .row{flex-wrap:wrap}
    .row>*{flex:1 1 46%}
    button.main{font-size:16px;padding:13px}
    .logo{width:34px;height:34px}
    .lead{margin-left:0}
  }

  .ac{position:relative;z-index:70}
  .ac-list{
    position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:120;
    /* 必须给不透明底色：候选项本身是透明的，
       下面压着的表单控件会透上来，看着像重叠 */
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.16);max-height:270px;overflow:auto;display:none;
  }
  .ac-list.on{display:block}
  .ac-item{padding:10px 13px;cursor:pointer;display:flex;justify-content:space-between;
    align-items:center;gap:10px;border-bottom:1px solid var(--line);
    background:var(--card)}
  .ac-item:last-child{border-bottom:0}
  .ac-item:hover,.ac-item.sel{background:var(--field)}
  .ac-name{font-weight:600;font-size:14.5px}
  .ac-code{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0}

  .picked{display:none;margin-top:9px;padding:10px 12px;background:var(--field);
    border-radius:11px;font-size:13.5px;align-items:center;gap:7px}
  .picked.on{display:flex}
  .picked b{font-size:14.5px}
  .picked .x{margin-left:auto;border:0;background:none;color:var(--sub);font-size:18px;
    padding:0 4px;cursor:pointer;line-height:1;font-family:inherit}

  button{font-family:inherit;cursor:pointer;border:0;transition:opacity .15s}
  button:active{opacity:.65}
  button:disabled{opacity:.45;cursor:default}
  button.main{width:100%;padding:14px;font-size:16.5px;font-weight:600;
    color:#fff;background:var(--accent);border-radius:12px;margin-top:14px}
  button.blue{background:var(--blue)}
  button.ghost{background:var(--field);color:var(--accent);padding:10px 13px;
    border-radius:10px;font-size:13.5px;font-weight:500}


  /* 提醒记录 */
  /* 可折叠的表头：整行都能点，右侧箭头指示状态 */
  .fold{cursor:pointer;-webkit-user-select:none;user-select:none;
        display:flex;align-items:center;gap:6px}
  .fold:active{opacity:.6}
  .fold .arrow{flex-shrink:0;transition:transform .18s;color:var(--sub)}
  .fold.closed .arrow{transform:rotate(-90deg)}
  .fold .fold-hint{margin-left:auto;font-size:12px;color:var(--sub);font-weight:400}
  .fold-body{overflow:hidden}
  .rec{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .rec:last-child{border-bottom:0}
  .rec-main{flex:1;min-width:0}
  .rec-name{font-weight:600;font-size:15px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .rec-code{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
  .rec-cond{margin-top:4px;font-size:13px;opacity:.9}
  .rec-time{margin-top:2px;font-size:11.5px;color:var(--sub)}
  .rec-right{text-align:right;flex-shrink:0}
  .px{font-size:14.5px;font-variant-numeric:tabular-nums;font-weight:600}
  .chg{font-size:11.5px;font-variant-numeric:tabular-nums}
  .up{color:#ff3b30}.down{color:#00a05a}.flat{color:var(--sub)}
  @media (prefers-color-scheme: dark){.up{color:#ff453a}.down{color:#32d74b}}
  .del{border:0;background:none;color:var(--danger);font-size:19px;cursor:pointer;
    padding:2px 0 2px 9px;line-height:1;font-family:inherit}

  .empty{text-align:center;color:var(--sub);padding:22px 8px;font-size:13.5px;line-height:1.7}



  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
    transform:translateX(-50%) translateY(150%);z-index:200;
    background:#1c1c1e;color:#fff;padding:13px 19px;border-radius:14px;
    font-size:14px;line-height:1.55;max-width:90vw;box-shadow:0 12px 34px rgba(0,0,0,.32);
    transition:transform .28s cubic-bezier(.2,.9,.3,1.2);text-align:center;white-space:pre-line}
  #toast.on{transform:translateX(-50%) translateY(0)}
  #toast.ok{background:#1d7a3a}
  #toast.err{background:#b3261e}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px}
  .dot.off{background:var(--sub)}
</style>
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 100 100" aria-label="干死狗庄">
    <circle cx="50" cy="50" r="48" fill="#d92b2b"/>
    <text x="50" y="70" font-size="58" text-anchor="middle" fill="#fff"
          font-family="PingFang SC,Microsoft YaHei,sans-serif" font-weight="bold">股</text>
  </svg>
  <div class="lead">到价提醒 · 自动推送</div>
</header>

<div class="cols">

  <!-- ==================== 左栏：到价提醒 ==================== -->
  <div class="col">
    <div class="col-title"><span class="bar"></span>到价提醒 · 设置与管理</div>

    <!-- 手动添加 -->
    <div class="card">
      <h2>添加提醒</h2>
      <div class="hint">代码可搜数字、名称、拼音首字母（gzmt）、拼音全拼（maotai）。保存后自动开始盯盘。</div>

      <label for="code">股票代码</label>
      <div class="ac">
        <input id="code" type="text" inputmode="search" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="600519 / 茅台 / gzmt / maotai">
        <div class="ac-list" id="acList"></div>
      </div>
      <div class="picked" id="picked"></div>

      <div class="row">
        <div>
          <label for="type">条件类型</label>
          <select id="type">
            <option value="price">价格</option>
            <option value="pct">当日涨跌幅</option>
          </select>
        </div>
        <div>
          <label for="dir">方向</label>
          <select id="dir">
            <option value="up">涨到 / 涨幅达到</option>
            <option value="down">跌到 / 跌幅达到</option>
          </select>
        </div>
      </div>

      <label for="value" id="valLabel">触发价格（元）</label>
      <input id="value" type="text" inputmode="decimal" placeholder="例如 1300">
      <div class="hint" id="valHint" style="margin:6px 0 0"></div>

      <label for="note">备注（可留空）</label>
      <input id="note" type="text" maxlength="40" placeholder="例如 突破前高">

      <button class="main blue" id="saveBtn">保 存</button>
    </div>

    <!-- 记录（默认折叠，点标题展开） -->
    <div class="card">
      <h2 class="fold closed" id="recToggle" role="button" tabindex="0"
          aria-expanded="false" aria-controls="recBody">
        <svg class="arrow" viewBox="0 0 24 24" width="15" height="15" fill="none"
             stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
             stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        提醒记录<span id="count" style="color:var(--sub);font-weight:400;font-size:13.5px"></span>
        <span class="fold-hint" id="foldHint"></span>
      </h2>
      <div class="fold-body" id="recBody" style="display:none">
        <div class="hint" style="margin-top:2px">
          <span class="dot" id="saveDot"></span><span id="saveState">正在检查存储…</span>
          <span id="monLine" style="display:block;margin-top:3px"></span>
        </div>
        <div id="list"></div>
        <div class="row" style="margin-top:13px">
          <button class="ghost" id="refreshBtn">刷新行情</button>
          <button class="ghost" id="testBtn">测试推送</button>
          <button class="ghost" id="copyBtn">复制配置</button>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="stocks.js"></script>
<script>
/* ==========================================================================
   干死狗庄 · 到价提醒
   - 提醒记录存 localStorage，写完必读回校验
   - 保存后自动交给后台盯盘（monitor.py），到价推送到手机
   - 行情走腾讯公开接口（带 CORS，浏览器可直连）
   - 股票清单与行业标签内置，搜索离线可用
   - 条件筛股：规则式中文解析 + 全市场扫描，不依赖任何大模型
   ========================================================================== */

const LS_KEY = "stock_alert_records_v1";
const QUOTE_API = "https://qt.gtimg.cn/q=";
const STOCKS = window.STOCKS || [];

let records = [];
let picked = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------------- 提示条 ---------------- */
let toastTimer = null;
function toast(text, kind) {
  const t = $("toast");
  t.textContent = text;
  t.className = "on" + (kind ? " " + kind : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, kind === "err" ? 5600 : 3600);
}

/* ==========================================================================
   一、行情
   ========================================================================== */

/** 按代码猜市场前缀 */
function guessPrefix(code) {
  if (/^(60|68|51|58|56|50|11|90)/.test(code)) return "sh";
  if (/^(43|83|87|88|92)/.test(code)) return "bj";
  return "sz";
}

/** 解析一行腾讯行情，返回结构化对象 */
function parseQuote(code, fields) {
  const num = i => {
    const v = parseFloat(fields[i]);
    return isFinite(v) ? v : 0;
  };
  return {
    code,
    name: (fields[1] || "").trim(),
    price: num(3),
    prevClose: num(4),
    open: num(5),
    volume: num(6),            // 手
    time: fields[30] || "",
    change: num(31),
    changePct: num(32),
    high: num(33),
    low: num(34),
    amount: num(37) * 10000,   // 成交额（元）
    turnover: num(38),         // 换手率 %
    pe: num(39),               // 市盈率(动)
    amplitude: num(43),        // 振幅 %
    floatCap: num(44),         // 流通市值（亿）
    totalCap: num(45),         // 总市值（亿）
    pb: num(46),               // 市净率
    limitUp: num(47),          // 涨停价
    limitDown: num(48),        // 跌停价
  };
}

/** 批量取行情（每批 60 只） */
async function fetchMany(codes) {
  const out = {};
  if (!codes.length) return out;
  for (let i = 0; i < codes.length; i += 60) {
    const batch = codes.slice(i, i + 60);
    try {
      const res = await fetch(QUOTE_API + batch.map(c => guessPrefix(c) + c).join(","),
        { cache: "no-store" });
      const text = new TextDecoder("gbk").decode(await res.arrayBuffer());
      text.split(";").forEach(line => {
        const m = line.match(/v_([a-z]{2})(\d{6})="([^"]*)"/);
        if (!m) return;
        const f = m[3].split("~");
        if (f.length < 50) return;
        const q = parseQuote(m[2], f);
        if (q.price > 0) out[m[2]] = q;
      });
    } catch (e) { /* 单批失败不影响其它 */ }
  }
  return out;
}



function ruleSummary(r) {
  const unit = r.type === "pct" ? "%" : "元";
  const v = Number(r.value);
  const shown = r.type === "pct" ? (v > 0 ? "+" : "") + v + unit : v + unit;
  return `${r.type === "pct" ? (r.dir === "up" ? "涨幅达到" : "跌幅达到") : (r.dir === "up" ? "涨到" : "跌到")} ${shown}`;
}


/* ==========================================================================
   六、下拉提示
   ========================================================================== */

let acIndex = -1, acHits = [];
let acSelecting = false;

function searchStocks(q) {
  const qRaw = q.trim();
  let s = qRaw.toLowerCase();
  if (!s) return [];
  const pfx = s.match(/^(sh|sz|bj)(\d{3,6})$/);
  if (pfx) s = pfx[2];
  const digits = /^\d+$/.test(s);
  const hits = [];
  for (let i = 0; i < STOCKS.length; i++) {
    const row = STOCKS[i];
    const code = row[0], name = row[1], py = row[3], hot = row[4] || 0;
    const pyFull = row[5] || "";      // 全拼，老数据没有这个字段就跳过
    let score = -1;
    if (digits) {
      if (code === s) score = 100;
      else if (code.startsWith(s)) score = 70;
      else if (code.includes(s)) score = 30;
    } else {
      const q = qRaw;
      if (name === q) score = 100;
      // 全拼优先于首字母：用户打 maotai 比打 gzmt 更自然
      else if (pyFull && pyFull === s) score = 92;
      else if (pyFull && pyFull.startsWith(s)) score = 90;
      else if (py && py.startsWith(s)) score = 88;
      else if (name.startsWith(q)) score = 85;
      else if (name.includes(q)) score = 55;
      else if (pyFull && pyFull.includes(s)) score = 40;
      else if (py && py.includes(s)) score = 25;
    }
    if (score > 0) {
      hits.push({ code, name, prefix: row[2], score: score + hot });
      if (hits.length > 400) break;
    }
  }
  hits.sort((a, b) => b.score - a.score || a.code.localeCompare(b.code));
  return hits.slice(0, 12);
}

function renderAc(list) {
  const box = $("acList");
  acHits = list; acIndex = -1;
  if (!list.length) { box.className = "ac-list"; box.innerHTML = ""; return; }
  box.innerHTML = list.map((s, i) =>
    `<div class="ac-item" data-i="${i}">
       <span class="ac-name">${esc(s.name)}</span>
       <span class="ac-code">${esc(s.code)} · ${esc(s.prefix.toUpperCase())}</span>
     </div>`).join("");
  box.className = "ac-list on";
  box.querySelectorAll(".ac-item").forEach(el => {
    const pick = e => {
      if (e && e.cancelable) e.preventDefault();
      if (e && e.stopPropagation) e.stopPropagation();
      chooseAc(+el.dataset.i);
    };
    el.addEventListener("pointerdown", pick);
    el.addEventListener("mousedown", pick);
    el.addEventListener("touchstart", pick, { passive: false });
  });
}

function closeAc() { $("acList").className = "ac-list"; acIndex = -1; }

function chooseAc(i) {
  const s = acHits[i];
  if (!s) return;
  acSelecting = true;
  picked = { code: s.code, name: s.name, prefix: s.prefix };
  $("code").value = s.code;
  closeAc();
  showPicked();
  try { $("value").focus(); } catch (e) {}
  setTimeout(() => { acSelecting = false; }, 300);
}

function showPicked() {
  const box = $("picked");
  if (!picked) { box.className = "picked"; box.innerHTML = ""; return; }
  box.className = "picked on";
  box.innerHTML = `<span class="dot"></span><b>${esc(picked.name)}</b>
    <span class="ac-code">${esc(picked.code)}</span>
    <button class="x" id="clearPick" title="清除">×</button>`;
  $("clearPick").addEventListener("click", () => {
    picked = null; $("code").value = ""; showPicked(); closeAc(); $("code").focus();
  });
}

/* ==========================================================================
   七、记录：存储、校验、渲染
   ========================================================================== */

function readStore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function writeStore(list) { localStorage.setItem(LS_KEY, JSON.stringify(list)); }

/** 写完读回，逐字段核对（需求里的"后台测试是否真保存完成"） */
function verifySaved(id) {
  let arr;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return { ok: false, why: "存储里没有数据" };
    arr = JSON.parse(raw);
  } catch (e) { return { ok: false, why: "存储内容无法解析" }; }
  if (!Array.isArray(arr)) return { ok: false, why: "存储格式不对" };
  const hit = arr.find(r => r.id === id);
  if (!hit) return { ok: false, why: "写进去又没读回来" };
  for (const k of ["code", "name", "type", "dir", "value"]) {
    if (hit[k] === undefined || hit[k] === null || hit[k] === "") {
      return { ok: false, why: "字段 " + k + " 丢失" };
    }
  }
  return { ok: true, record: hit, total: arr.length };
}

function storageHealth() {
  try {
    const probe = "__p__" + Date.now();
    localStorage.setItem(probe, "1");
    const ok = localStorage.getItem(probe) === "1";
    localStorage.removeItem(probe);
    return ok;
  } catch (e) { return false; }
}

function condText(r) {
  return ruleSummary({ type: r.type, dir: r.dir, value: Number(r.value) });
}

/** 保存入口：写完读回校验，通过后自动交给后台盯盘 */
async function saveRecord(rec) {
  // 去重
  const dup = records.find(r => r.code === rec.code && r.type === rec.type &&
    r.dir === rec.dir && Math.abs(Number(r.value) - Number(rec.value)) < 1e-9);
  if (dup) {
    toast(`这条已经有了：\n${dup.name}　${condText(dup)}`, "err");
    return false;
  }
  const full = {
    id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    code: rec.code, name: rec.name, prefix: guessPrefix(rec.code),
    type: rec.type, dir: rec.dir, value: Number(rec.value),
    note: rec.note || "", createdAt: Date.now(),
  };
  try {
    writeStore(records.concat([full]));
    const check = verifySaved(full.id);
    if (!check.ok) throw new Error(check.why);
    records = readStore();
    render();
    toast(`${check.record.name}　${condText(check.record)}\n设置提醒完成 ✓\n（已保存 ${check.total} 条，校验通过）`, "ok");
    updateSaveState();
    // 保存即交给后台盯盘：同步提醒并确保监控在跑（用户不用管这件事）
    syncAlertsToMonitor(true);
    return true;
  } catch (e) {
    records = readStore();
    render();
    toast("保存失败：" + (e && e.message ? e.message : e) +
          "\n可能原因：浏览器存储被禁用或已满", "err");
    return false;
  }
}

/* ---------------- 手动保存 ---------------- */
$("saveBtn").addEventListener("click", async () => {
  const btn = $("saveBtn");
  if (!picked) {
    const typed = $("code").value.trim();
    if (/^\d{6}$/.test(typed)) {
      toast("请先在下拉提示里选中这只股票\n（确认名称没选错）", "err");
      $("code").focus();
      return;
    }
    toast("请输入股票代码，并在下拉提示里选一只", "err");
    $("code").focus();
    return;
  }
  const type = $("type").value;
  const dir = $("dir").value;
  let value = parseFloat(String($("value").value).replace(/[%％,，\s]/g, ""));
  if (!isFinite(value)) {
    toast("请填触发" + (type === "pct" ? "涨跌幅" : "价格") + "\n例如 " + (type === "pct" ? "-3" : "1300"), "err");
    $("value").focus();
    return;
  }
  if (type === "pct") {
    if (dir === "down" && value > 0) value = -value;
    if (dir === "up" && value < 0) value = Math.abs(value);
  } else if (value <= 0) {
    toast("价格要大于 0", "err");
    $("value").focus();
    return;
  }

  btn.disabled = true; btn.textContent = "保存中…";
  await new Promise(r => setTimeout(r, 100));
  const ok = await saveRecord({
    code: picked.code, name: picked.name, type, dir, value,
    note: $("note").value.trim(),
  });
  if (ok) resetForm();
  btn.disabled = false; btn.textContent = "保 存";
});

function resetForm() {
  picked = null;
  $("code").value = ""; $("value").value = ""; $("note").value = "";
  $("dir").value = "up";
  $("type").value = "price";
  $("type").dispatchEvent(new Event("change"));
  showPicked(); closeAc();
  $("code").focus();
}

function delRecord(id) {
  const rec = records.find(r => r.id === id);
  if (!rec) return;
  if (!confirm(`删除这条提醒？\n\n${rec.name}　${condText(rec)}`)) return;
  writeStore(records.filter(r => r.id !== id));
  records = readStore();
  render(); updateSaveState();
  syncAlertsToMonitor(true);       // 删到没提醒时，后台会自动停，别空转
  toast("已删除", "ok");
}

function render() {
  const box = $("list");
  $("count").textContent = records.length ? `共 ${records.length} 条` : "";
  // 折叠时右边那行小字要跟着条数更新（没记录就不提示"点这里展开"）
  const hint = $("foldHint");
  if (hint && $("recToggle").classList.contains("closed")) {
    hint.textContent = records.length ? "点这里展开" : "";
  }
  if (!records.length) {
    box.innerHTML = `<div class="empty">还没有记录<br>在上面「添加提醒」里选一只股票、填个条件，<br>点保存就会自动开始盯盘</div>`;
    return;
  }
  box.innerHTML = records.slice().reverse().map(r => `
    <div class="rec" data-id="${esc(r.id)}">
      <div class="rec-main">
        <div class="rec-name">${esc(r.name)}<span class="rec-code">${esc(r.code)}</span></div>
        <div class="rec-cond">${esc(condText(r))}${r.note ? "　·　" + esc(r.note) : ""}</div>
        <div class="rec-time">添加于 ${esc(fmtTime(r.createdAt))}</div>
      </div>
      <div class="rec-right">
        <div class="px" data-px="${esc(r.code)}">—</div>
        <div class="chg" data-chg="${esc(r.code)}"></div>
      </div>
      <button class="del" data-del="${esc(r.id)}" title="删除">×</button>
    </div>`).join("");
  box.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", () => delRecord(b.dataset.del)));
  fillPrices();
}

function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let filling = false;
async function fillPrices() {
  if (filling) return;
  // 收起时列表是 hidden，拉了也看不见，白费一次网络请求
  const body = $("recBody");
  if (body && body.style.display === "none") return;

  const codes = [...new Set(records.map(r => r.code))];
  if (!codes.length) return;
  filling = true;
  try {
    const q = await fetchMany(codes);
    codes.forEach(code => {
      const px = document.querySelector(`[data-px="${code}"]`);
      const chg = document.querySelector(`[data-chg="${code}"]`);
      if (!px) return;
      const d = q[code];
      if (!d) { px.textContent = "—"; if (chg) chg.textContent = "取不到行情"; return; }
      px.textContent = d.price.toFixed(2);
      if (chg) {
        const cls = d.change > 0 ? "up" : (d.change < 0 ? "down" : "flat");
        chg.className = "chg " + cls;
        chg.textContent = `${d.change > 0 ? "▲" : (d.change < 0 ? "▼" : "─")}${d.changePct.toFixed(2)}%`;
      }
    });
  } finally { filling = false; }
}

function updateSaveState() {
  const healthy = storageHealth();
  $("saveDot").className = "dot" + (healthy ? "" : " off");
  $("saveState").textContent = healthy
    ? `存储正常，已保存 ${records.length} 条记录`
    : "浏览器存储不可用，保存会失败";
}

/* ---------------- 提醒记录的折叠 ----------------
   默认收起，只留标题和条数，省得把上面「添加提醒」挤下去。
   展开状态记在 localStorage 里，下次打开保持用户的选择。
   ------------------------------------------------------------------ */

const FOLD_KEY = "stock_alert_records_open";

function setRecordsFold(open, save) {
  const head = $("recToggle");
  const body = $("recBody");
  if (!head || !body) return;

  head.classList.toggle("closed", !open);
  head.setAttribute("aria-expanded", open ? "true" : "false");
  body.style.display = open ? "" : "none";
  $("foldHint").textContent = open ? "" : (records.length ? "点这里展开" : "");

  if (save) {
    try { localStorage.setItem(FOLD_KEY, open ? "1" : "0"); } catch (e) { /* 忽略 */ }
  }
  // 展开时才值得去拉行情（收起时列表是 hidden，拉了也看不见）
  if (open) fillPrices();
}

function initRecordsFold() {
  let open = false;                     // 默认收起
  try {
    const saved = localStorage.getItem(FOLD_KEY);
    if (saved !== null) open = saved === "1";
  } catch (e) { /* 存储不可用时就用默认值 */ }

  setRecordsFold(open, false);

  const head = $("recToggle");
  head.addEventListener("click", () => {
    setRecordsFold(head.classList.contains("closed"), true);
  });
  // 键盘可达：回车/空格也能展开收起
  head.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      setRecordsFold(head.classList.contains("closed"), true);
    }
  });
}

/* ==========================================================================
   八、按钮与事件
   ========================================================================== */

$("refreshBtn").addEventListener("click", async () => {
  toast("正在刷新行情…");
  await fillPrices();
  toast("行情已更新", "ok");
});

$("copyBtn").addEventListener("click", async () => {
  if (!records.length) { toast("还没有记录可复制", "err"); return; }
  const cfg = { alerts: records.map(r => ({ code: r.code, type: r.type, dir: r.dir, value: r.value, note: r.note || r.name })) };
  const text = JSON.stringify(cfg, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    toast(`已复制 ${records.length} 条配置\n可粘到电脑版 config.json`, "ok");
  } catch (e) { prompt("复制下面的内容：", text); }
});

let acTimer = null;
$("code").addEventListener("input", () => {
  const v = $("code").value;
  if (picked && v !== picked.code) { picked = null; showPicked(); }
  clearTimeout(acTimer);
  acTimer = setTimeout(() => {
    renderAc(searchStocks(v));
    if (/^\d{6}$/.test(v.trim()) && !picked) {
      const hit = STOCKS.find(s => s[0] === v.trim());
      if (hit) { picked = { code: hit[0], name: hit[1], prefix: hit[2] }; showPicked(); }
    }
  }, 90);
});

$("code").addEventListener("keydown", e => {
  const box = $("acList");
  const open = box.className.includes("on");
  if (e.key === "ArrowDown" && open) { e.preventDefault(); acIndex = Math.min(acIndex + 1, acHits.length - 1); }
  else if (e.key === "ArrowUp" && open) { e.preventDefault(); acIndex = Math.max(acIndex - 1, 0); }
  else if (e.key === "Enter") {
    if (open && acIndex >= 0) { e.preventDefault(); chooseAc(acIndex); return; }
    if (open && acHits.length) { e.preventDefault(); chooseAc(0); return; }
    if (picked) { e.preventDefault(); $("value").focus(); }
    return;
  } else if (e.key === "Escape") { closeAc(); return; }
  box.querySelectorAll(".ac-item").forEach((el, i) => el.classList.toggle("sel", i === acIndex));
});

$("code").addEventListener("blur", () => {
  setTimeout(() => { if (!acSelecting) closeAc(); }, 180);
});

$("value").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("saveBtn").click(); } });

$("type").addEventListener("change", () => {
  const isPct = $("type").value === "pct";
  $("valLabel").textContent = isPct ? "触发涨跌幅（%）" : "触发价格（元）";
  $("value").placeholder = isPct ? "例如 -3 表示跌 3%" : "例如 1300";
  $("valHint").textContent = isPct ? "填正数会自动按方向补符号，跌 3% 填 3 即可" : "";
});
$("type").dispatchEvent(new Event("change"));

/* ==========================================================================
   九、后台推送接口（手机版为占位）

   手机版没有本地服务器：提醒存在这台设备的浏览器里，盯盘和推送由电脑上的
   桌面版负责。所以这里把所有后台调用换成一个必定失败的实现 —— 函数签名
   保持不变，上层逻辑一行都不用改，天然走「后台不可用」的降级分支。
   ========================================================================== */

let monAvailable = null;        // null=还没探测过；false=后台没连上
let monTimer = null;

async function monFetch(path, body) {
  // 手机版：没有本地后台，直接抛错，让上层走降级分支（不弹错误）
  throw new Error("no-local-backend");
}

/** 在「提醒记录」那栏显示一行监控状态（不显眼，出问题才突出） */
function renderMonLine(text, warn) {
  const el = $("monLine");
  if (!el) return;
  el.textContent = text || "";
  el.style.color = warn ? "#ffaa00" : "var(--sub)";
}

/** 把当前提醒同步给后台；有提醒就确保监控在跑，没提醒就停掉 */
async function syncAlertsToMonitor(silent) {
  try {
    const payload = records.map(r => ({
      code: r.code, name: r.name, type: r.type, dir: r.dir,
      value: Number(r.value), note: r.note || "",
    }));
    const r = await monFetch("/alerts", { alerts: payload });
    if (!r || !r.ok) throw new Error((r && r.message) || "同步失败");
    monAvailable = true;

    // 有提醒就保证监控在跑；删光了就停，别空转
    if (records.length > 0) {
      const st = await monFetch("/start", { interval: 20 });
      const paused = st.pausedReason ? `（${st.pausedReason}自动休眠，开盘自动开始）` : "";
      renderMonLine(`盯盘中：${records.length} 条提醒已交给后台，关掉网页也会推送到手机${paused}`);
    } else {
      await monFetch("/stop", {});
      renderMonLine("没有提醒，后台已暂停");
    }
    return r;
  } catch (e) {
    if (monAvailable !== false || !silent) {
      monAvailable = false;
      renderMonLine("手机版：提醒存在这台设备上；盯盘和推送在电脑那边跑", false);
    }
    return null;
  }
}

/** 静默刷新那一行状态（不打断用户） */
async function refreshMon(silent) {
  try {
    const st = await monFetch("/status");
    monAvailable = true;
    const paused = st.pausedReason ? `，当前${st.pausedReason}休眠中` : "";
    const fired = st.triggeredCount ? `，今日已推 ${st.triggeredCount} 条` : "";
    const chans = (st.channels || []).join("/") || "无推送通道";
    renderMonLine(st.running
      ? `盯盘中：${st.alertCount} 条提醒${paused}${fired}　通道 ${chans}`
      : (records.length ? "提醒已保存，后台监控未运行" : "还没有提醒"));
    if (!monTimer) {
      monTimer = setInterval(() => {
        if (document.visibilityState === "visible") refreshMon(true);
      }, 5000);
    }
    return st;
  } catch (e) {
    monAvailable = false;
    renderMonLine("手机版：提醒存在这台设备上；盯盘和推送在电脑那边跑", false);
    return null;
  }
}

/* 「测试推送」优先走后端（后端发的才是真实推送链路），
   后端不可用时退回浏览器直发。 */
$("testBtn").addEventListener("click", async () => {
  if (monAvailable !== false) {
    toast("正在通过后台测试推送…");
    try {
      const r = await monFetch("/testpush", {});
      toast(r.message || (r.ok ? "已发送" : "发送失败"), r.ok ? "ok" : "err");
      await refreshMon(true);
      return;
    } catch (e) { /* 落到浏览器直发 */ }
  }
  toast("正在测试推送（浏览器直发）…");
  try {
    const r = await fetch("https://api.day.app/6ZGDLHHGUiVM52y9F3uL8P/" +
      encodeURIComponent("干死狗庄 · 到价提醒测试") + "/" +
      encodeURIComponent("收到这条说明推送通了"));
    const j = await r.json().catch(() => null);
    if (j && j.code === 200) toast("已发送，去看看手机", "ok");
    else toast("推送返回异常：" + JSON.stringify(j).slice(0, 80), "err");
  } catch (e) {
    toast("推送失败：" + e.message + "\n（浏览器直连可能被拦，用启动.bat 打开更准）", "err");
  }
});

/* ---------------- 启动 ----------------
   顺序很重要：**先把提醒同步给后台，再读状态**。
   反过来的话，状态行会显示同步前的旧数字（实测踩过）。
   ------------------------------------------------------------------ */
(async function init() {
  records = readStore();
  if (!STOCKS.length) toast("股票清单没加载出来（stocks.js 缺失）", "err");
  updateSaveState();
  render();
  // 放在 render 之后：折叠提示要根据已有条数来决定显不显示
  initRecordsFold();

  const r = await syncAlertsToMonitor(true);   // 顺带探测后台是否可用
  if (r) await refreshMon(true);
})();
</script>
