<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="干死狗庄">
<meta name="theme-color" content="#f5f5f7">
<title>干死狗庄</title>
<!-- 图标：红色底 + 白色「股」字。
     注意：iOS 加到主屏幕时**不认 SVG**，只认 PNG，所以必须用真实文件。
     主屏图标还要是满底色的（iOS 自己裁圆角），透明的话四角会发黑。 -->
<link rel="icon" type="image/png" sizes="32x32" href="appicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="appicon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="appicon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="appicon-512.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    color-scheme: light dark;
    --bg:#f5f5f7; --card:#fff; --fg:#1c1c1e; --sub:#8a8a8e;
    --line:#e6e6ea; --accent:#d92b2b; --blue:#0a84ff; --danger:#ff3b30; --ok:#30a350;
    --field:#f0f0f3; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --card:#1c1c1e; --fg:#fff; --sub:#98989d; --line:#2c2c2e;
           --field:#2c2c2e; --shadow:none; --accent:#ff453a; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 40px);
    max-width:1180px;margin:0 auto;
  }

  /* 顶部：图标和副标题并排对齐（不显示软件名，名字只在主屏图标和网页标题上） */
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .logo{width:40px;height:40px;flex-shrink:0}
  .lead{color:var(--sub);font-size:12.5px;line-height:1.45}

  /* 双栏 */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  @media (max-width:860px){ .cols{grid-template-columns:1fr} }
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .col-title{
    font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.5px;
    padding:0 2px 2px;display:flex;align-items:center;gap:6px;
  }
  .col-title .bar{width:3px;height:14px;background:var(--accent);border-radius:2px}

  .card{background:var(--card);border-radius:14px;padding:15px;box-shadow:var(--shadow)}
  .card h2{font-size:15.5px;margin:0 0 3px;display:flex;align-items:center;gap:6px}
  .card h2 .n{
    background:var(--accent);color:#fff;width:19px;height:19px;border-radius:50%;
    font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .hint{color:var(--sub);font-size:12px;margin-bottom:11px;line-height:1.5}

  label{display:block;font-size:12px;color:var(--sub);margin:12px 0 6px;font-weight:500}
  input,select,textarea{
    width:100%;padding:12px 13px;font-size:16px;font-family:inherit;
    background:var(--field);color:var(--fg);
    border:1.5px solid transparent;border-radius:11px;outline:none;
    -webkit-appearance:none;appearance:none;
  }
  textarea{resize:vertical;min-height:96px;line-height:1.55;font-size:15px}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--card)}
  input::placeholder,textarea::placeholder{color:var(--sub)}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
    background-position:calc(100% - 18px) 51%,calc(100% - 13px) 51%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
  .row{display:flex;gap:9px}
  .row>*{flex:1;min-width:0}

  /* 窄屏：让弹性行自动换行，避免按钮被挤出屏幕 */
  @media (max-width:560px){
    .card{padding:13px}
    .row{flex-wrap:wrap}
    .row>*{flex:1 1 46%}
    button.main{font-size:16px;padding:13px}
    .logo{width:34px;height:34px}
    .lead{margin-left:0}
  }

  .ac{position:relative}
  .ac-list{
    position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.16);max-height:270px;overflow:auto;display:none;
  }
  .ac-list.on{display:block}
  .ac-item{padding:10px 13px;cursor:pointer;display:flex;justify-content:space-between;
    align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .ac-item:last-child{border-bottom:0}
  .ac-item:hover,.ac-item.sel{background:var(--field)}
  .ac-name{font-weight:600;font-size:14.5px}
  .ac-code{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0}

  .picked{display:none;margin-top:9px;padding:10px 12px;background:var(--field);
    border-radius:11px;font-size:13.5px;align-items:center;gap:7px}
  .picked.on{display:flex}
  .picked b{font-size:14.5px}
  .picked .x{margin-left:auto;border:0;background:none;color:var(--sub);font-size:18px;
    padding:0 4px;cursor:pointer;line-height:1;font-family:inherit}

  button{font-family:inherit;cursor:pointer;border:0;transition:opacity .15s}
  button:active{opacity:.65}
  button:disabled{opacity:.45;cursor:default}
  button.main{width:100%;padding:14px;font-size:16.5px;font-weight:600;
    color:#fff;background:var(--accent);border-radius:12px;margin-top:14px}
  button.blue{background:var(--blue)}
  button.ghost{background:var(--field);color:var(--accent);padding:10px 13px;
    border-radius:10px;font-size:13.5px;font-weight:500}

  /* 分析结果框 */
  .analysis{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;
    padding:13px;font-size:14px;line-height:1.65;display:none}
  .analysis.on{display:block}
  .analysis.ok{border-color:#a8dfb9;background:rgba(48,163,80,.06)}
  .analysis.ask{border-color:#ffd48a;background:rgba(255,170,0,.07)}
  .analysis.err{border-color:#ffb3ae;background:rgba(255,59,48,.06)}
  @media (prefers-color-scheme: dark){
    .analysis.ok{border-color:#1f6b37;background:rgba(48,163,80,.12)}
    .analysis.ask{border-color:#7a5b12;background:rgba(255,170,0,.12)}
    .analysis.err{border-color:#7a2a25;background:rgba(255,59,48,.12)}
  }
  .analysis .hd{font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .parsed{background:var(--field);border-radius:9px;padding:9px 11px;margin:8px 0;font-size:13px}
  .parsed div{display:flex;gap:8px;padding:2px 0}
  .parsed .k{color:var(--sub);min-width:62px;flex-shrink:0}
  .analysis .qbtn{background:var(--accent);color:#fff;padding:9px 14px;border-radius:9px;
    font-size:14px;font-weight:600;margin-top:9px;width:100%}

  /* 提醒记录 */
  /* 可折叠的表头：整行都能点，右侧箭头指示状态 */
  .fold{cursor:pointer;-webkit-user-select:none;user-select:none;
        display:flex;align-items:center;gap:6px}
  .fold:active{opacity:.6}
  .fold .arrow{flex-shrink:0;transition:transform .18s;color:var(--sub)}
  .fold.closed .arrow{transform:rotate(-90deg)}
  .fold .fold-hint{margin-left:auto;font-size:12px;color:var(--sub);font-weight:400}
  .fold-body{overflow:hidden}
  .rec{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .rec:last-child{border-bottom:0}
  .rec-main{flex:1;min-width:0}
  .rec-name{font-weight:600;font-size:15px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .rec-code{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
  .rec-cond{margin-top:4px;font-size:13px;opacity:.9}
  .rec-time{margin-top:2px;font-size:11.5px;color:var(--sub)}
  .rec-right{text-align:right;flex-shrink:0}
  .px{font-size:14.5px;font-variant-numeric:tabular-nums;font-weight:600}
  .chg{font-size:11.5px;font-variant-numeric:tabular-nums}
  .up{color:#ff3b30}.down{color:#00a05a}.flat{color:var(--sub)}
  @media (prefers-color-scheme: dark){.up{color:#ff453a}.down{color:#32d74b}}
  .del{border:0;background:none;color:var(--danger);font-size:19px;cursor:pointer;
    padding:2px 0 2px 9px;line-height:1;font-family:inherit}

  /* 问财结果 */
  .res{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
  .res:last-child{border-bottom:0}
  .tick{width:21px;height:21px;border-radius:50%;background:var(--ok);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .res-main{flex:1;min-width:0}
  .res-name{font-weight:600;font-size:14.5px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .res-why{margin-top:3px;font-size:12px;color:var(--sub);line-height:1.5}
  /* 结构对照：把「为什么是这只」摊开给用户看 */
  .cmp{margin-top:5px;padding:6px 8px;background:var(--field);border-radius:7px;
       font-size:11.5px;color:var(--sub);line-height:1.65;
       font-variant-numeric:tabular-nums}
  .cmp b{color:var(--fg);font-weight:600}
  .res-right{text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--sub);padding:22px 8px;font-size:13.5px;line-height:1.7}
  .bar{height:4px;background:var(--field);border-radius:3px;overflow:hidden;margin-top:10px;display:none}
  .bar.on{display:block}
  .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

  /* 语音输入按钮 */
  .mic{
    display:flex;align-items:center;justify-content:center;gap:7px;
    width:100%;margin-top:9px;padding:11px;font-size:14.5px;font-weight:600;
    color:var(--accent);background:var(--field);border:1.5px solid transparent;
    border-radius:11px;font-family:inherit;cursor:pointer;
    transition:background .15s,border-color .15s,transform .1s;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  .mic:active{transform:scale(.985)}
  .mic.listening{
    background:var(--accent);color:#fff;border-color:var(--accent);
    animation:pulse 1.1s infinite;
  }
  .mic.unsupported{opacity:.5}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(217,43,43,.45)}
    50%{box-shadow:0 0 0 9px rgba(217,43,43,0)}
  }

  /* 图片上传区 */
  .drop{
    border:2px dashed var(--line);border-radius:13px;padding:20px 14px;
    text-align:center;cursor:pointer;color:var(--sub);
    transition:border-color .18s,background .18s,color .18s;
  }
  .drop:hover,.drop.hover{
    border-color:var(--accent);color:var(--accent);
    background:rgba(217,43,43,.05);
  }
  .drop-t{font-size:14px;font-weight:600;margin-top:8px;color:var(--fg)}
  .drop-s{font-size:11.5px;margin-top:5px;line-height:1.5}

  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
    transform:translateX(-50%) translateY(150%);z-index:200;
    background:#1c1c1e;color:#fff;padding:13px 19px;border-radius:14px;
    font-size:14px;line-height:1.55;max-width:90vw;box-shadow:0 12px 34px rgba(0,0,0,.32);
    transition:transform .28s cubic-bezier(.2,.9,.3,1.2);text-align:center;white-space:pre-line}
  #toast.on{transform:translateX(-50%) translateY(0)}
  #toast.ok{background:#1d7a3a}
  #toast.err{background:#b3261e}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px}
  .dot.off{background:var(--sub)}
  kbd{background:var(--field);border-radius:5px;padding:1px 5px;font-size:11.5px}
</style>
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 100 100" aria-label="干死狗庄">
    <circle cx="50" cy="50" r="48" fill="#d92b2b"/>
    <text x="50" y="70" font-size="58" text-anchor="middle" fill="#fff"
          font-family="PingFang SC,Microsoft YaHei,sans-serif" font-weight="bold">股</text>
  </svg>
  <div class="lead">添加提醒 · 条件选股 · 按图找相似</div>
</header>

<div class="cols">

  <!-- ==================== 左栏：到价提醒 ==================== -->
  <div class="col">
    <div class="col-title"><span class="bar"></span>到价提醒 · 设置与管理</div>

    <!-- 手动添加 -->
    <div class="card">
      <h2><span class="n">A</span>添加提醒</h2>
      <div class="hint">代码可搜数字、名称、拼音首字母（gzmt）、拼音全拼（maotai）。保存后自动开始盯盘。</div>

      <label for="code">股票代码</label>
      <div class="ac">
        <input id="code" type="text" inputmode="search" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="600519 / 茅台 / gzmt / maotai">
        <div class="ac-list" id="acList"></div>
      </div>
      <div class="picked" id="picked"></div>

      <div class="row">
        <div>
          <label for="type">条件类型</label>
          <select id="type">
            <option value="price">价格</option>
            <option value="pct">当日涨跌幅</option>
          </select>
        </div>
        <div>
          <label for="dir">方向</label>
          <select id="dir">
            <option value="up">涨到 / 涨幅达到</option>
            <option value="down">跌到 / 跌幅达到</option>
          </select>
        </div>
      </div>

      <label for="value" id="valLabel">触发价格（元）</label>
      <input id="value" type="text" inputmode="decimal" placeholder="例如 1300">
      <div class="hint" id="valHint" style="margin:6px 0 0"></div>

      <label for="note">备注（可留空）</label>
      <input id="note" type="text" maxlength="40" placeholder="例如 突破前高">

      <button class="main blue" id="saveBtn">保 存</button>
    </div>

    <!-- 记录（默认折叠，点标题展开） -->
    <div class="card">
      <h2 class="fold closed" id="recToggle" role="button" tabindex="0"
          aria-expanded="false" aria-controls="recBody">
        <svg class="arrow" viewBox="0 0 24 24" width="15" height="15" fill="none"
             stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
             stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        提醒记录<span id="count" style="color:var(--sub);font-weight:400;font-size:13.5px"></span>
        <span class="fold-hint" id="foldHint"></span>
      </h2>
      <div class="fold-body" id="recBody" style="display:none">
        <div class="hint" style="margin-top:2px">
          <span class="dot" id="saveDot"></span><span id="saveState">正在检查存储…</span>
          <span id="monLine" style="display:block;margin-top:3px"></span>
        </div>
        <div id="list"></div>
        <div class="row" style="margin-top:13px">
          <button class="ghost" id="refreshBtn">刷新行情</button>
          <button class="ghost" id="testBtn">测试推送</button>
          <button class="ghost" id="copyBtn">复制配置</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 右栏：筛股票 + 找相似 ==================== -->
  <div class="col">
    <div class="col-title"><span class="bar"></span>选股</div>

    <div class="card">
      <h2><span class="n">B</span>条件选股 · 按图找相似</h2>
      <div class="hint">
        写条件就扫全市场筛股票；丢一张 K 线截图就找形态相似的票。<br>
        每只都会标 <b>√</b>（符合）或说明为什么不确定。
        <kbd>Enter</kbd> 换行　<kbd>Ctrl</kbd>+<kbd>Enter</kbd> 执行
      </div>

      <textarea id="askText" placeholder="筛股票：市盈率低于10的银行股
筛股票：今天涨幅超过5%的半导体
筛股票：市值大于1000亿 换手率低于1%
找相似：把 K 线截图拖进来，或按 Ctrl+V 粘贴"></textarea>

      <!-- 语音输入：按住说话，松手变文字 -->
      <button class="mic" id="micBtn" type="button">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
        <span id="micLabel">按住说话</span>
      </button>

      <div class="drop" id="dropZone" style="margin-top:10px">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M3 16l4-4 3 3 4-5 7 7"/>
          <circle cx="8.5" cy="8.5" r="1.3"/>
        </svg>
        <div class="drop-t">要按图找相似？把 K 线截图拖进来</div>
        <div class="drop-s" id="fileName">
          或点这里选图、<kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴 · 图片只在你浏览器里处理，不上传
        </div>
        <input type="file" id="imgInput" accept="image/png,image/*" hidden>
      </div>

      <div class="row" id="imgOpts" style="margin-top:11px;display:none">
        <div>
          <label for="klt">截图是什么周期？</label>
          <select id="klt">
            <option value="day">日线</option>
            <option value="week">周线</option>
            <option value="month">月线</option>
          </select>
        </div>
        <div>
          <label for="scanScope">扫描范围</label>
          <select id="scanScope">
            <option value="all">全市场 5571 只（约 15 秒）</option>
            <option value="top800">热门 800 只（约 2 秒）</option>
          </select>
        </div>
      </div>

      <div class="row" style="margin-top:11px">
        <button class="main blue" id="askBtn" style="margin-top:0">开始选股</button>
        <button class="ghost" id="clearBtn" style="flex:0 0 74px">清空</button>
      </div>
      <div class="bar" id="askBar"><i></i></div>
      <div class="analysis" id="askOut"></div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="stocks.js"></script>
<script src="industry.js"></script>
<script src="vision.js"></script>
<script>
/* ==========================================================================
   干死狗庄 · 到价提醒 + 条件选股 + 按图找相似
   - 提醒记录存 localStorage，写完必读回校验
   - 保存后自动交给后台盯盘（monitor.py），到价推送到手机
   - 行情走腾讯公开接口（带 CORS，浏览器可直连）
   - 股票清单与行业标签内置，搜索离线可用
   - 条件筛股：规则式中文解析 + 全市场扫描，不依赖任何大模型
   ========================================================================== */

const LS_KEY = "stock_alert_records_v1";
const QUOTE_API = "https://qt.gtimg.cn/q=";
const STOCKS = window.STOCKS || [];
const INDUSTRY = window.INDUSTRY || {};

let records = [];
let picked = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------------- 提示条 ---------------- */
let toastTimer = null;
function toast(text, kind) {
  const t = $("toast");
  t.textContent = text;
  t.className = "on" + (kind ? " " + kind : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, kind === "err" ? 5600 : 3600);
}

/* ==========================================================================
   一、行情
   ========================================================================== */

/** 按代码猜市场前缀 */
function guessPrefix(code) {
  if (/^(60|68|51|58|56|50|11|90)/.test(code)) return "sh";
  if (/^(43|83|87|88|92)/.test(code)) return "bj";
  return "sz";
}

/** 解析一行腾讯行情，返回结构化对象 */
function parseQuote(code, fields) {
  const num = i => {
    const v = parseFloat(fields[i]);
    return isFinite(v) ? v : 0;
  };
  return {
    code,
    name: (fields[1] || "").trim(),
    price: num(3),
    prevClose: num(4),
    open: num(5),
    volume: num(6),            // 手
    time: fields[30] || "",
    change: num(31),
    changePct: num(32),
    high: num(33),
    low: num(34),
    amount: num(37) * 10000,   // 成交额（元）
    turnover: num(38),         // 换手率 %
    pe: num(39),               // 市盈率(动)
    amplitude: num(43),        // 振幅 %
    floatCap: num(44),         // 流通市值（亿）
    totalCap: num(45),         // 总市值（亿）
    pb: num(46),               // 市净率
    limitUp: num(47),          // 涨停价
    limitDown: num(48),        // 跌停价
  };
}

/** 批量取行情（每批 60 只） */
async function fetchMany(codes) {
  const out = {};
  if (!codes.length) return out;
  for (let i = 0; i < codes.length; i += 60) {
    const batch = codes.slice(i, i + 60);
    try {
      const res = await fetch(QUOTE_API + batch.map(c => guessPrefix(c) + c).join(","),
        { cache: "no-store" });
      const text = new TextDecoder("gbk").decode(await res.arrayBuffer());
      text.split(";").forEach(line => {
        const m = line.match(/v_([a-z]{2})(\d{6})="([^"]*)"/);
        if (!m) return;
        const f = m[3].split("~");
        if (f.length < 50) return;
        const q = parseQuote(m[2], f);
        if (q.price > 0) out[m[2]] = q;
      });
    } catch (e) { /* 单批失败不影响其它 */ }
  }
  return out;
}

async function fetchQuote(code) {
  const r = await fetchMany([code]);
  return r[code] || null;
}

/* ==========================================================================
   二、中文条件解析（规则式，不依赖大模型）
   ========================================================================== */

/* 可筛选的指标。key 与行情字段一一对应，方便直接用。 */
const FIELDS = [
  { key: "price",     label: "现价",       unit: "元",  aliases: ["股价", "价格", "现价", "报价"] },
  { key: "changePct", label: "涨跌幅",     unit: "%",   aliases: ["涨幅", "跌幅", "涨跌", "涨跌幅度"] },
  { key: "pe",        label: "市盈率",     unit: "倍",  aliases: ["pe", "市盈", "本益比"] },
  { key: "pb",        label: "市净率",     unit: "倍",  aliases: ["pb", "市净", "净资产"] },
  { key: "totalCap",  label: "总市值",     unit: "亿",  aliases: ["市值", "总市值", "盘子"] },
  { key: "floatCap",  label: "流通市值",   unit: "亿",  aliases: ["流通市值", "流通盘"] },
  { key: "turnover",  label: "换手率",     unit: "%",   aliases: ["换手", "换手率"] },
  { key: "amount",    label: "成交额",     unit: "亿",  aliases: ["成交额", "成交金额", "量能"] },
  { key: "volume",    label: "成交量",     unit: "手",  aliases: ["成交量", "量"] },
  { key: "amplitude", label: "振幅",       unit: "%",   aliases: ["振幅"] },
];

/** 比较符的中文说法 */
const OPS = [
  { op: "<=", words: ["低于", "小于", "不到", "不足", "少于", "不超过", "<=", "＜", "≤"] },
  { op: ">=", words: ["高于", "大于", "超过", "多于", "至少", "不低于", ">=", "＞", "≥"] },
  { op: "<",  words: ["小于", "低于", "<", "＜"] },
  { op: ">",  words: ["大于", "高于", "超过", ">", "＞"] },
  { op: "==", words: ["等于", "=", "=="] },
];

/** 中文数字 → 阿拉伯数字（只处理常见量级） */
function cnNum(s) {
  const map = { 零:0, 一:1, 二:2, 两:2, 三:3, 四:4, 五:5, 六:6, 七:7, 八:8, 九:9, 十:10 };
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  if (s === "十") return 10;
  let m = s.match(/^十(.)$/);
  if (m && map[m[1]] != null) return 10 + map[m[1]];
  m = s.match(/^(.)十(.)?$/);
  if (m && map[m[1]] != null) return map[m[1]] * 10 + (m[2] && map[m[2]] != null ? map[m[2]] : 0);
  if (map[s] != null) return map[s];
  return null;
}

/** 把「1.5亿」「3000万」这类换算成统一的数值（按字段单位） */
function scaleTo(text, field) {
  let v = parseFloat(text);
  if (!isFinite(v)) return null;
  const hasYi = /亿/.test(text), hasWan = /万/.test(text);
  if (field.key === "amount") {                     // 成交额单位：亿
    if (hasWan) v = v / 10000;
    return v;                                        // 默认按亿
  }
  if (field.key === "volume") {                      // 成交量单位：手
    if (hasYi) v = v * 100000000;
    else if (hasWan) v = v * 10000;
    return v;
  }
  return v;                                          // 其余（价/PE/PB/%/亿）直接用
}

/**
 * 解析一段中文，抽出若干筛选条件。
 * 返回 { rules: [...], stocks: [...], unknown: [...] }
 */
function parseConditions(text) {
  const rules = [];
  const usedSpans = [];
  let src = String(text || "").replace(/[，,、；;]/g, " ");

  // ---- 1. 找「字段 + 比较符 + 数值」组合 ----
  for (const field of FIELDS) {
    for (const alias of [field.label, ...field.aliases]) {
      if (!alias) continue;
      // 该指标名之后的 12 个字以内，找一个比较符和数字
      const idxRe = new RegExp(alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      let m;
      while ((m = idxRe.exec(src)) !== null) {
        const from = m.index;
        if (usedSpans.some(s => from >= s[0] && from < s[1])) continue;
        const tail = src.slice(from + alias.length, from + alias.length + 16);

        let hit = null;
        for (const { op, words } of OPS) {
          for (const w of words) {
            const wRe = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") +
                                   "\\s*(-?\\d+(?:\\.\\d+)?)\\s*(亿|万)?");
            const mm = tail.match(wRe);
            if (mm) {
              const val = scaleTo(mm[1] + (mm[2] || ""), field);
              if (val !== null) {
                hit = { op, val, raw: alias + w + mm[1] + (mm[2] || ""), len: m[0].length + mm[0].length };
                break;
              }
            }
          }
          if (hit) break;
        }
        if (hit) {
          rules.push({ field: field.key, fieldLabel: field.label, unit: field.unit,
                       op: hit.op, value: hit.val, raw: hit.raw });
          usedSpans.push([from, from + hit.len + 2]);
          break;
        }
      }
    }
  }

  // ---- 2. 默认阈值的关键词（用户只说词、不说数字）----
  // 这些是股民的口头说法，不给数字也应该懂。
  // 放在数字规则之后、涨跌方向之前：明确写了数字的优先。
  const KEYWORDS = [
    { re: /破净|跌破净资产|低于净资产/, field: "pb", op: "<", value: 1,
      raw: "破净（市净率<1）" },
    { re: /低价股|便宜的股|白菜价/, field: "price", op: "<", value: 5,
      raw: "低价（现价<5元）" },
    { re: /高价股/, field: "price", op: ">", value: 100,
      raw: "高价（现价>100元）" },
    { re: /小盘股|小市值/, field: "totalCap", op: "<", value: 50,
      raw: "小盘（总市值<50亿）" },
    { re: /大盘股|大市值/, field: "totalCap", op: ">", value: 500,
      raw: "大盘（总市值>500亿）" },
  ];
  for (const kw of KEYWORDS) {
    if (kw.re.test(src) && !rules.some(r => r.field === kw.field)) {
      const f = FIELDS.find(x => x.key === kw.field);
      rules.push({ field: kw.field, fieldLabel: f ? f.label : kw.field,
                   unit: f ? f.unit : "", op: kw.op, value: kw.value ?? kw.val,
                   raw: kw.raw });
    }
  }

  // ---- 3. 涨跌方向 ----
  // 「涨得猛」「跌得惨」这种带程度副词的，用户意思是"涨/跌了不少"，
  // 给一个 5% 的默认阈值，比单纯「>0」更贴近真实意图。
  if (!rules.some(r => r.field === "changePct")) {
    const strongUp = /涨得(?:猛|凶|多|狠|厉害|不错)|大涨|暴涨|涨停/.test(src);
    const strongDown = /跌得(?:惨|狠|多|凶|厉害)|大跌|暴跌|跌停/.test(src);
    if (strongUp) {
      rules.push({ field: "changePct", fieldLabel: "涨跌幅", unit: "%",
                   op: ">", value: 5, raw: "大涨（涨幅>5%）" });
    } else if (strongDown) {
      rules.push({ field: "changePct", fieldLabel: "涨跌幅", unit: "%",
                   op: "<", value: -5, raw: "大跌（跌幅>5%）" });
    } else if (/今天涨|上涨的|红的|飘红|涨的/.test(src)) {
      rules.push({ field: "changePct", fieldLabel: "涨跌幅", unit: "%",
                   op: ">", value: 0, raw: "今天上涨" });
    } else if (/今天跌|下跌的|绿的|飘绿|跌的/.test(src)) {
      rules.push({ field: "changePct", fieldLabel: "涨跌幅", unit: "%",
                   op: "<", value: 0, raw: "今天下跌" });
    }
  }

  // ---- 4. 行业（近似标签）----
  for (const ind of Object.keys(INDUSTRY)) {
    if (ind.startsWith("_")) continue;
    if (src.includes(ind)) {
      rules.push({ field: "industry", fieldLabel: "行业", op: "in",
                   value: ind, raw: "行业=" + ind, approx: true });
      break;
    }
  }

  // ---- 5. 具体股票名 / 代码 ----
  const stocks = [];
  const codeRe = /\b(\d{6})\b/g;
  let cm;
  while ((cm = codeRe.exec(src)) !== null) {
    const hit = STOCKS.find(s => s[0] === cm[1]);
    if (hit) stocks.push({ code: hit[0], name: hit[1] });
  }
  if (!stocks.length) {
    for (const s of STOCKS) {
      if (s[1].length >= 2 && src.includes(s[1]) && !stocks.some(x => x.code === s[0])) {
        stocks.push({ code: s[0], name: s[1] });
        if (stocks.length >= 8) break;
      }
    }
  }

  return { rules, stocks };
}

/* ==========================================================================
   三、问财：扫描全市场并判断
   ========================================================================== */

const CACHE = new Map();            // code -> quote，避免重复请求
let marketCache = null;             // 全市场快照
let marketCacheAt = 0;

function fmtMoney(yuan) {
  if (!isFinite(yuan) || yuan <= 0) return "0";
  if (yuan >= 1e8) return (yuan / 1e8).toFixed(2) + "亿";
  if (yuan >= 1e4) return (yuan / 1e4).toFixed(2) + "万";
  return yuan.toFixed(0);
}

/** 取全市场行情，带缓存（默认 60 秒内不重复扫） */
async function getMarket(force, onProgress) {
  const now = Date.now();
  if (!force && marketCache && now - marketCacheAt < 60000) {
    onProgress && onProgress(1);
    return marketCache;
  }
  const codes = STOCKS.map(s => s[0]);

  // 切成每批 60 只，然后用固定并发数的池子跑（实测比按大块分组快好几倍）
  const batches = [];
  for (let i = 0; i < codes.length; i += 60) batches.push(codes.slice(i, i + 60));

  const out = {};
  let finished = 0;
  const total = batches.length;
  const CONCURRENCY = 8;
  const failed = [];              // 失败的批次，最后重试

  async function oneBatch(batch) {
    let ok = false;
    // 重试 2 次：全市场筛选最怕因为网络抖动漏掉几只有效股票
    for (let attempt = 0; attempt < 3 && !ok; attempt++) {
      try {
        const res = await fetch(QUOTE_API + batch.map(c => guessPrefix(c) + c).join(","),
          { cache: "no-store" });
        const text = new TextDecoder("gbk").decode(await res.arrayBuffer());
        let got = 0;
        text.split(";").forEach(line => {
          const m = line.match(/v_([a-z]{2})(\d{6})="([^"]*)"/);
          if (!m) return;
          const f = m[3].split("~");
          if (f.length < 50) return;
          const q = parseQuote(m[2], f);
          if (q.price > 0) { out[m[2]] = q; got++; }
        });
        // 这一批里一只都没解析出来 → 当作失败，稍后重试
        if (got > 0 || batch.length === 0) ok = true;
      } catch (e) { /* 继续重试 */ }
      if (!ok && attempt < 2) await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
    }
    if (!ok) failed.push(batch);
    finished++;
    onProgress && onProgress(finished / total);
  }

  let next = 0;
  async function worker() {
    while (true) {
      const i = next++;
      if (i >= batches.length) return;
      await oneBatch(batches[i]);
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, batches.length) }, worker));

  if (failed.length) {
    console.warn("[干死狗庄] 有 " + failed.length + " 批最终没取到：" +
      failed.map(b => b[0][0]).join(","));
  }

  marketCache = out;
  marketCacheAt = Date.now();
  return out;
}

/** 单条规则是否满足，返回 { ok, why } */
function testRule(rule, q) {
  if (rule.field === "industry") {
    const list = INDUSTRY[rule.value] || [];
    const ok = list.includes(q.code);
    return { ok, why: ok ? `${rule.value}（近似标签）` : "" };
  }
  const v = q[rule.field];
  if (v == null || !isFinite(v)) {
    return { ok: false, unknown: true, why: "该指标取不到数据" };
  }
  let ok;
  switch (rule.op) {
    case ">":  ok = v >  rule.value; break;
    case ">=": ok = v >= rule.value; break;
    case "<":  ok = v <  rule.value; break;
    case "<=": ok = v <= rule.value; break;
    case "==": ok = Math.abs(v - rule.value) < 1e-6; break;
    default:   ok = false;
  }
  const unit = rule.unit || "";
  let shown;
  if (rule.field === "amount") shown = fmtMoney(v * 1e8);
  else if (rule.field === "volume") shown = (v / 10000).toFixed(2) + "万手";
  else shown = (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(2)) + unit;

  const opWord = { ">": ">", ">=": "≥", "<": "<", "<=": "≤", "==": "=" }[rule.op];
  return { ok, why: `${rule.fieldLabel} ${shown}（要求 ${opWord} ${rule.value}${unit}）` };
}

/* ==========================================================================
   四、中文解析工具（供条件筛股、股票名匹配使用）
   ========================================================================== */

const UP_WORDS = ["涨到", "升到", "涨破", "突破", "升破", "涨过", "高于", "涨上", "上到"];
const DOWN_WORDS = ["跌到", "跌破", "跌下", "低于", "落到", "掉到", "下滑到"];

/**
 * 解析提醒语句。
 * 返回 { ok, rule, question, options }
 */
function parseAlert(text) {
  const src = String(text || "").trim();
  if (!src) return { ok: false, question: "还没输入内容。" };

  const { rules, stocks } = parseConditions(src);

  // ---- 找股票 ----
  let stock = stocks[0] || null;
  let ambigu = null;                 // 匹到多只时留到后面一起问

  const cleanBare = t => t
    // 数字直接删掉（不留空格）：否则 "gzmt跌破1200" 会变成 "gzmt " 和 " "
    // 两个 token，拼音被切碎就匹配不到了
    .replace(/\d+(\.\d+)?/g, "")
    .replace(/[%％.。，,、；;：:!！?？]/g, " ")
    .replace(/涨到|升到|涨破|突破|升破|涨过|跌到|跌破|跌下|低于|落到|掉到|下滑到|高于/g, " ")
    .replace(/提醒我|提醒|告诉我|通知我|通知|说一下|告我/g, " ")
    .replace(/帮我|给我|我要|我想|请|麻烦|设置|设个|设|条件|看一下|看下/g, " ")
    .replace(/今天|明天|盘中|收盘|元|块|钱|个点|左右|附近|以上|以下/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  if (!stock) {
    const bare = cleanBare(src);
    const tokens = bare.split(" ").filter(t => t.length >= 2)
      // 长 token 更可能是股票名（"贵州茅台" 优先于 "贵州"）
      .sort((a, b) => b.length - a.length);

    for (const token of tokens) {
      const t = token.toLowerCase();
      // 1) 名称完全一致
      let cand = STOCKS.filter(s => s[1] === token);
      // 2) 名称前缀（"茅台" → "贵州茅台" 需靠下一档，这里处理"贵州茅"这类）
      if (!cand.length) cand = STOCKS.filter(s => s[1].startsWith(token));
      // 3) 名称包含（"茅台" → "贵州茅台"）
      if (!cand.length) cand = STOCKS.filter(s => s[1].includes(token));
      // 4) 拼音首字母（"gzmt" → "贵州茅台"）
      if (!cand.length) cand = STOCKS.filter(s => s[3] && s[3] === t);

      if (cand.length === 1) { stock = { code: cand[0][0], name: cand[0][1] }; break; }

      if (cand.length > 1) {
        // 名称完全一致的优先；否则按热度挑，只把热门的前几个作为选项
        const exact = cand.filter(s => s[1] === token);
        const pool = exact.length ? exact : cand.slice(0, 12);
        if (pool.length === 1) { stock = { code: pool[0][0], name: pool[0][1] }; break; }
        // 若某个候选的拼音与 token 完全一致，直接用它（拼音一般唯一）
        const pyHit = pool.filter(s => s[3] && s[3] === t);
        if (pyHit.length === 1) { stock = { code: pyHit[0][0], name: pyHit[0][1] }; break; }
        ambigu = { token, options: pool.map(s => ({ code: s[0], name: s[1] })) };
        break;
      }
    }

    if (ambigu) {
      return {
        ok: false, ask: true,
        question: `「${ambigu.token}」匹配到多只股票，你指的是哪一只？`,
        options: ambigu.options,
        raw: src,
      };
    }
    if (!stock) {
      return { ok: false, ask: true,
               question: "我没认出要盯哪只股票。请写清股票名称或 6 位代码，例如「贵州茅台跌破1250」或「600519 涨到1500」。" };
    }
  }

  // ---- 判断是价格还是涨跌幅 ----
  const isPct = /涨跌幅|涨幅|跌幅|涨超|跌超|上涨\d|下跌\d|个点|%|％/.test(src);
  const dirUp = UP_WORDS.some(w => src.includes(w)) ||
                (/涨/.test(src) && !DOWN_WORDS.some(w => src.includes(w)));
  const dirDown = DOWN_WORDS.some(w => src.includes(w)) || /跌/.test(src);

  // ---- 抓数值 ----
  // 关键：先把股票代码和股票名从文本里挖掉再找数字。
  // 否则「600519 涨到1400」会把代码 600519 当成触发价格（实测踩过这个坑）。
  let numSrc = src;
  numSrc = numSrc.split(stock.code).join(" ");
  numSrc = numSrc.split(stock.name).join(" ");
  // 再挖掉清单里所有 6 位代码，防止用户顺手写了别的代码
  numSrc = numSrc.replace(/\b\d{6}\b/g, " ");

  let num = null;
  const pctMatch = numSrc.match(/(-?\d+(?:\.\d+)?)\s*[%％]/);
  const numMatch = numSrc.match(/(\d+(?:\.\d+)?)/);

  if (isPct && pctMatch) {
    num = Math.abs(parseFloat(pctMatch[1]));
  } else if (numMatch) {
    num = parseFloat(numMatch[1]);
  } else {
    // 试中文数字：「跌破五块」「涨到一百二」
    const cn = numSrc.match(/([一二两三四五六七八九十百]+)\s*(?:元|块|个点)?/);
    if (cn) num = cnNum(cn[1]);
  }

  // 要显式带上单位才认（避免把「涨到」后面的噪音当数值）
  if (num === null || !isFinite(num) || num <= 0) {
    return { ok: false, ask: true,
             question: `我知道要盯「${stock.name}」，但没看到触发数值。请补一个数字，例如「${stock.name}${dirDown ? "跌破" : "涨到"}多少」？` };
  }

  // ---- 组装 ----
  const type = isPct ? "pct" : "price";
  let direction;
  if (dirDown && !dirUp) direction = "down";
  else if (dirUp && !dirDown) direction = "up";
  else {
    return { ok: false, ask: true,
             question: `「${stock.name} ${num}」是要涨到还是要跌到？说清方向我才好设。`,
             options: [
               { code: stock.code, name: `涨到 ${num}${type === "pct" ? "%" : "元"}`, dir: "up" },
               { code: stock.code, name: `跌到 ${num}${type === "pct" ? "%" : "元"}`, dir: "down" },
             ] };
  }

  let value = num;
  if (type === "pct") {
    if (direction === "down") value = -Math.abs(num);
    else value = Math.abs(num);
    if (value === 0) {
      return { ok: false, ask: true, question: "涨跌幅不能是 0，请换一个数值。" };
    }
  } else if (value <= 0) {
    return { ok: false, ask: true, question: "价格要大于 0，请检查数值。" };
  }

  const note = src.length <= 40 ? src : src.slice(0, 40);

  // 其他没被当成方向/数值的筛选条件，提示用户（例如「市盈率低于10的茅台」）
  const extra = rules.filter(r => r.field !== "price" && r.field !== "changePct");

  return {
    ok: true,
    rule: { code: stock.code, name: stock.name, type, dir: direction, value, note },
    extra: extra.length ? extra : null,
  };
}

function showAnalysis(box, kind, html) {
  box.className = "analysis on " + kind;
  box.innerHTML = html;
}

function ruleSummary(r) {
  const unit = r.type === "pct" ? "%" : "元";
  const v = Number(r.value);
  const shown = r.type === "pct" ? (v > 0 ? "+" : "") + v + unit : v + unit;
  return `${r.type === "pct" ? (r.dir === "up" ? "涨幅达到" : "跌幅达到") : (r.dir === "up" ? "涨到" : "跌到")} ${shown}`;
}

  // 只有股票名 → 直接查这几只

    `);
    return;
  }

  // 条件解析不出来 → 反问
  if (!parsed.rules.length) {

      </div>
    `);
    return;
  }

  // 全市场扫描
  bar.className = "bar on";
  box.className = "analysis";
  try {
    const market = await getMarket(true, p => {
      bar.firstElementChild.style.width = Math.round(p * 100) + "%";

    bar.className = "bar";

    const all = Object.values(market);
    const hits = [];

    for (const q of all) {

      for (const r of parsed.rules) {

        if (t.unknown) { unk = true; break; }

        else { ok = false; break; }

    hits.sort((a, b) => b.q.totalCap - a.q.totalCap);

    const cap = 60;

    const rulesText = parsed.rules.map(r =>
      r.field === "industry"
        ? `${r.value}（近似标签）`

        <div class="res">

          <div class="res-main">
            <div class="res-name">${esc(x.q.name)} <span class="ac-code">${esc(x.q.code)}</span></div>
            <div class="res-why">${esc(x.reasons.join(" ｜ "))}</div>
          </div>
          <div class="res-right">
            <div class="px ${x.q.change > 0 ? "up" : (x.q.change < 0 ? "down" : "flat")}">${x.q.price.toFixed(2)}</div>
            <div class="chg ${x.q.change > 0 ? "up" : (x.q.change < 0 ? "down" : "flat")}">${x.q.changePct > 0 ? "▲" : (x.q.changePct < 0 ? "▼" : "─")}${x.q.changePct.toFixed(2)}%</div>
          </div>
        </div>`).join("")}

      ${hits.length > cap ? `<div class="hint" style="margin-top:10px">只显示市值最大的 ${cap} 只，共 ${hits.length} 只符合。</div>` : ""}
      ${!hits.length ? `<div class="hint" style="margin-top:10px">放宽一点条件试试，或者检查指标写法。</div>` : ""}
      ${unknowns.length ? `<div class="hint" style="margin-top:8px">另有 ${unknowns.length} 只因为取不到指标数据（次新股/停牌）没能判断。</div>` : ""}
    `);
  } catch (e) {
    bar.className = "bar";
    showAnalysis(box, "err", `<div class="hd">❌ 扫描失败</div><div>${esc(e.message)}</div>`);
  }
}

/* ==========================================================================
   五之二、按图找相似股票
   --------------------------------------------------------------------------
   流程：
     1. 从截图里还原 K 线走势（vision.js）
     2. 拉全市场历史 K 线（东财接口，带 CORS）
     3. 用滑动窗口逐只比对，算两种相似度：
        · 形态相似度 —— 只比形状，与股价高低无关
        · 幅度相似度 —— 区间涨跌幅是否接近
     4. 自检：把 Top 结果重新取数复算一遍，确认不是偶然算错
   ========================================================================== */

const KLT = { day: 101, week: 102, month: 103 };
const KLT_LABEL = { day: "日线", week: "周线", month: "月线" };
// 历史 K 线：腾讯有多个等价端点，单个子域容易被限流（实测 web.ifzq 会返回 501），
// 所以做端点轮换；东财作为最后兜底。
const TX_KLINE_HOSTS = [
  "https://ifzq.gtimg.cn",
  "https://proxy.finance.qq.com/ifzqgtimg",
  "https://web.ifzq.gtimg.cn",
];
const EM_KLINE = "https://push2his.eastmoney.com/api/qt/stock/kline/get";
let txHostIndex = 0;        // 记住上次成功的端点，减少无效尝试

function secidOf(code, prefix) {
  // 东财：1=沪市，0=深市/北交所
  return (prefix === "sh" ? "1." : "0.") + code;
}

/** 解析腾讯返回，返回 [{date,o,c,h,l,v}] */
function parseTencent(d, kind) {
  const data = (d && d.data) || {};
  for (const sym of Object.keys(data)) {
    const obj = data[sym];
    if (!obj || typeof obj !== "object") continue;
    for (const key of ["qfq" + kind, kind]) {
      const arr = obj[key];
      if (Array.isArray(arr) && arr.length) {
        return arr.map(r => ({
          date: r[0],
          o: +r[1], c: +r[2], h: +r[3], l: +r[4], v: +(r[5] || 0),
        })).filter(b => isFinite(b.c) && b.c > 0);
      }
    }
  }
  return [];
}

/** 解析东财返回 */
function parseEastmoney(d) {
  const kl = (d && d.data && d.data.klines) || [];
  return kl.map(line => {
    const p = line.split(",");
    return { date: p[0], o: +p[1], c: +p[2], h: +p[3], l: +p[4], v: +(p[5] || 0) };
  }).filter(b => isFinite(b.c) && b.c > 0);
}

/**
 * 取历史 K 线。腾讯多端点轮换，失败再试东财。
 * kind: day / week / month
 */
async function fetchKline(code, prefix, kind, lmt) {
  const sym = prefix + code;
  const n = Math.min(lmt, 300);          // 实测超过 300 会被拒

  // ---- 源 1：腾讯（端点轮换，从上次成功的那个开始试）----
  // 每个端点试 2 轮、轮间加退避延时：服务端限流是暂时的，
  // 短暂等待后重试能救回大部分请求，避免某只股票被静默跳过。
  const order = TX_KLINE_HOSTS.map((_, i) => TX_KLINE_HOSTS[(txHostIndex + i) % TX_KLINE_HOSTS.length]);
  for (let round = 0; round < 2; round++) {
    for (let i = 0; i < order.length; i++) {
      const url = `${order[i]}/appstock/app/fqkline/get?param=${sym},${kind},,,${n},qfq`;
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (res.ok) {
          const d = await res.json();
          const bars = parseTencent(d, kind);
          if (bars.length >= 5) {
            txHostIndex = (txHostIndex + i) % TX_KLINE_HOSTS.length;
            return bars;
          }
        }
      } catch (e) { /* 换下一个端点 */ }
    }
    if (round === 0) await new Promise(r => setTimeout(r, 900 + Math.random() * 700));
  }

  // ---- 源 2：东财 ----
  const klt = KLT[kind] || 101;
  const emUrl = `${EM_KLINE}?secid=${secidOf(code, prefix)}` +
    `&fields1=f1,f2&fields2=f51,f52,f53,f54,f55,f56&klt=${klt}&fqt=1` +
    `&end=20500101&lmt=${Math.min(lmt, 500)}`;
  try {
    const res = await fetch(emUrl, { cache: "no-store" });
    const d = await res.json();
    const bars = parseEastmoney(d);
    if (bars.length >= 5) return bars;
  } catch (e) { /* 两个源都没成 */ }

  return [];
}

/* ---------------- 数学工具 ---------------- */

/** z-score 标准化：消掉股价高低和绝对波动的影响，只留形状 */
function standardize(arr) {
  const n = arr.length;
  if (!n) return [];
  const mean = arr.reduce((a, b) => a + b, 0) / n;
  const std = Math.sqrt(arr.reduce((a, b) => a + (b - mean) ** 2, 0) / n) || 1;
  return arr.map(v => (v - mean) / std);
}

/** 皮尔逊相关系数（两边都标准化后就是余弦相似度） */
function pearson(a, b) {
  const n = Math.min(a.length, b.length);
  if (n < 3) return 0;
  const ma = a.slice(0, n).reduce((x, y) => x + y, 0) / n;
  const mb = b.slice(0, n).reduce((x, y) => x + y, 0) / n;
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < n; i++) {
    const x = a[i] - ma, y = b[i] - mb;
    num += x * y; da += x * x; db += y * y;
  }
  return (da && db) ? num / Math.sqrt(da * db) : 0;
}

/** 标准差（衡量形状的"起伏程度"） */
function stdev(arr) {
  const n = arr.length;
  if (n < 2) return 0;
  const m = arr.reduce((a, b) => a + b, 0) / n;
  return Math.sqrt(arr.reduce((a, b) => a + (b - m) ** 2, 0) / n);
}

/**
 * 提取一段走势的「结构特征」。
 *
 * 为什么要这个：光靠皮尔逊相关系数会看走眼。
 * 实测一个真实案例——用一张「长期上行 → 尖顶 → 急速深跌 → 底部反弹」的周线图扫全市场，
 * 皮尔逊给出的第一名相关 91.6%，但它「顶前只涨了 33%」，而原图涨了 72%，
 * 上涨段差了一倍。皮尔逊只看整体起伏同不同步，看不出这种结构差异。
 *
 * 所以另外把这几件事量出来：
 *   顶在哪、底在哪、顶到底隔几根、跌了多少、顶前涨了多少、底后反弹多少
 */
function structureOf(seq) {
  const n = seq.length;
  if (n < 6) return null;

  let peakI = 0, troughI = 0;
  for (let i = 1; i < n; i++) {
    if (seq[i] > seq[peakI]) peakI = i;
    if (seq[i] < seq[troughI]) troughI = i;
  }
  const peakV = seq[peakI], troughV = seq[troughI];
  if (!(peakV > 0) || !(troughV > 0)) return null;

  return {
    peakI, troughI, peakV, troughV,
    // 顶在底之前才算「先涨后跌」，否则这个形态和目标不是一类
    orderedToFall: troughI > peakI,
    gap: troughI - peakI,
    drop: (troughV / peakV - 1) * 100,          // 跌了多少（负数）
    rise: (peakV / seq[0] - 1) * 100,           // 顶之前涨了多少
    rebound: (seq[n - 1] / troughV - 1) * 100,  // 底之后反弹多少
  };
}

/**
 * 把「结构差多少」量化成一个分数（越小越像）。
 *
 * 每一项都用目标自身的量级做归一化，这样不同形态的图都适用：
 * 比如顶底间隔，差 2 根对间隔 9 根的形态就算差很多，对间隔 60 根的就不算什么。
 */
function structureDiff(target, cand) {
  if (!target || !cand) return null;
  // 目标有「先涨后跌」结构，候选没有 → 直接判为不像
  if (target.orderedToFall && !cand.orderedToFall) return null;

  const norm = (a, b, floor) => Math.min(1, Math.abs(a - b) / Math.max(floor, Math.abs(b) * 0.35));

  const dGap = norm(cand.gap, target.gap, 4);
  const dDrop = norm(cand.drop, target.drop, 12);
  const dRise = norm(cand.rise, target.rise, 15);
  const dReb = norm(cand.rebound, target.rebound, 12);

  // 四项各自 0~1，加权平均后仍是 0~1，方便和相关系数按比例合成
  const struct01 = (dGap * 1.6 + dDrop * 1.4 + dRise * 0.9 + dReb * 0.6) / 4.5;

  return {
    struct01,
    total: struct01 * 4.5,
    dGap, dDrop, dRise, dReb,
    // 顶和底的位置偏差（根数），用来给用户看对齐程度
    offset: target.orderedToFall
      ? Math.abs(cand.peakI - target.peakI) + Math.abs(cand.troughI - target.troughI)
      : 0,
  };
}

/**
 * 综合评分：结构 60% + 相关系数 40%（结果 0~1，越小越像）。
 *
 * 这个比例是两轮实测定下来的：
 *
 * 1) 只看相关系数不行。一张「尖顶+急速深跌」的周线图，相关最高的候选有 91.6%，
 *    但它顶前只涨 33%，原图涨 72%（上涨段差一倍），顶底间隔还偏了 124 根。
 *    相关系数只反映起伏同不同步，看不出结构差异。
 *
 * 2) 只用结构也不行。结构项一开始是直接相加（最大 4.5），相关系数最多贡献 0.55，
 *    权重严重失衡 —— 结果「形状几乎一样、只是某一项差一点」的候选被压到后面，
 *    偏离 58 根的反而排第 3。
 *
 * 现在两项都归一化到 0~1 再按 6:4 合成。实测四条回归案例全部第 1 名找回自己，
 * 且第 2~6 名的结构质量明显变好（浙江力诺前 6 名里有 5 只顶底偏离 ≤2 根）。
 */
function shapeScore(targetStruct, targetZ, win, zWin) {
  const cand = structureOf(win);
  const diff = structureDiff(targetStruct, cand);
  const corr = pearson(targetZ, zWin);
  if (!diff) {
    // 结构不符：重罚，别让它挤进前排
    return { score: 1.5, corr, struct: cand, diff: null };
  }
  return {
    score: diff.struct01 * 0.6 + (1 - corr) * 0.4,
    corr, struct: cand, diff,
  };
}

/**
 * 在一条历史序列里找与目标形态最像的窗口。
 * target 已标准化；history 是原始价格序列。
 *
 * 注意：这里**不做**标准差比例的预筛选。
 * 之前为了省算力加过一道 "窗口标准差 / 目标标准差" 的闸门，
 * 结果把正常窗口也全滤掉了（实测平安银行、宁德时代一个候选都没剩下，
 * 导致"自己都找不回自己"）。皮尔逊相关系数本身就会归一化尺度，
 * 不需要预筛选；算力上全市场也只是秒级，不值得冒这个风险。
 */
function bestWindow(target, prices, step = 2, targetStruct = null) {
  const L = target.length;
  if (prices.length < L) return null;
  let best = null;

  for (let start = 0; start + L <= prices.length; start += step) {
    const win = prices.slice(start, start + L);
    const z = standardize(win);
    const r = targetStruct
      ? shapeScore(targetStruct, target, win, z)
      : { score: 1 - pearson(target, z), corr: pearson(target, z), struct: null, diff: null };
    if (!best || r.score < best.score) {
      const chg = (win[win.length - 1] - win[0]) / win[0] * 100;
      best = {
        score: r.score, corr: r.corr, struct: r.struct, diff: r.diff,
        start, end: start + L - 1, window: win, change: chg,
      };
    }
  }
  return best;
}

/** 目标形态自身的区间涨跌幅（用于幅度比对） */
function seriesChange(series) {
  if (series.length < 2) return 0;
  const first = series[0], last = series[series.length - 1];
  return first ? (last - first) / Math.abs(first) * 100 : 0;
}

/* ---------------- 进度条 ---------------- */

function setBar(barEl, ratio) {
  barEl.classList.add("on");
  barEl.firstElementChild.style.width = Math.round(Math.max(0, Math.min(1, ratio)) * 100) + "%";
}
function hideBar(barEl) { barEl.classList.remove("on"); }

/* ---------------- 并发池 ---------------- */

async function poolRun(items, worker, limit, onTick) {
  let next = 0, done = 0;
  async function run() {
    while (true) {
      const i = next++;
      if (i >= items.length) return;
      try { await worker(items[i], i); } catch (e) { /* 单只失败不影响整体 */ }
      done++;
      onTick && onTick(done / items.length);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, run));
}

/* ---------------- 主流程 ---------------- */

let lastVision = null;      // 上次识别的结果，供"换周期重找"复用

async function analyzeImage(file) {
  const box = $("askOut");
  const bar = $("askBar");
  const kltKey = $("klt").value;
  const kind = KLT[kltKey] ? kltKey : "day";

  // ---- 1. 识别图片 ----
  showAnalysis(box, "ask", `<div class="hd">🔍 正在识别图片…</div>
    <div class="hint">从截图里还原 K 线，这一步在你的浏览器里完成，图片不会上传。</div>`);

  let bytes;
  try {
    bytes = new Uint8Array(await file.arrayBuffer());
  } catch (e) {
    showAnalysis(box, "err", `<div class="hd">❌ 读不到图片</div><div>${esc(e.message)}</div>`);
    return;
  }

  let vision;
  try {
    vision = await ChartVision.extract(bytes);
  } catch (e) {
    showAnalysis(box, "err", `<div class="hd">❌ 图片解析失败</div>
      <div>${esc(e.message)}</div>
      <div class="hint" style="margin-top:8px">请用截图工具重新截一张 PNG 格式的 K 线图，
      只截 K 线区域效果最好。</div>`);
    return;
  }

  if (!vision.candles.length || vision.candles.length < 8) {
    showAnalysis(box, "ask", `<div class="hd">❓ 没能从图里认出 K 线</div>
      ${vision.warnings.map(w => `<div>· ${esc(w)}</div>`).join("")}
      <div class="hint" style="margin-top:8px">
        建议：<br>
        1. 只截 K 线主图（别把成交量、指标一起截进来）<br>
        2. 用 PNG 格式，别用打了码或压得很糊的图<br>
        3. 至少要有 10 根以上 K 线
      </div>`);
    return;
  }

  const target = ChartVision.closeSeries(vision.candles);
  const targetZ = standardize(target);
  const targetChg = seriesChange(target);
  const targetStruct = structureOf(target);   // 顶/底位置、跌幅、顶前涨幅、底后反弹
  const L = target.length;

  lastVision = { target, targetZ, targetChg, L, kltKey, kind };

  // ---- 2. 拉全市场历史数据 ----
  showAnalysis(box, "ask", `
    <div class="hd">✅ 已认出 ${L} 根 K 线（${KLT_LABEL[kltKey]}）</div>
    <div class="hint">正在拉全市场历史数据并逐只比对，约十几秒…</div>`);

  const need = L * 3 + 20;                    // 留足滑动空间
  const lmt = Math.min(1000, Math.max(need, 250));
  const scope = ($("scanScope") && $("scanScope").value) || "all";
  // 热门模式只扫成交额靠前的部分（STOCKS 本身就是按成交额降序排列的）
  const scopeMap = { top300: 300, top800: 800 };
  const universe = scopeMap[scope] ? STOCKS.slice(0, scopeMap[scope]) : STOCKS;
  const results = [];
  let fetched = 0, noData = 0;

  await poolRun(universe, async (row) => {
    const [code, name, prefix] = row;
    const bars = await fetchKline(code, prefix, kind, lmt);
    if (bars.length < L + 2) { noData++; return; }
    const prices = bars.map(b => b.c);
    const w = bestWindow(targetZ, prices, kind === "day" ? 2 : 1, targetStruct);
    if (!w) { noData++; return; }
    results.push({
      code, name, prefix, bars,
      corr: w.corr,
      score: w.score,
      struct: w.struct,
      diff: w.diff,
      start: w.start, end: w.end,
      change: w.change,
      price: prices[prices.length - 1],
      lastDate: bars[bars.length - 1].date,
      firstDate: bars[w.start].date,
      lastDateWin: bars[w.end].date,
    });
    fetched++;
  }, 16, p => setBar(bar, p));

  hideBar(bar);

  if (!results.length) {
    showAnalysis(box, "ask", `<div class="hd">❓ 没找到可比对的数据</div>
      <div>可能是图片周期选错了，或者网络取不到历史数据。</div>`);
    return;
  }

  // ---- 3. 排序 ----
  // 结构分越小越像（顶底位置、跌幅、顶前涨幅都对得上），相关系数只作辅助
  results.sort((a, b) => a.score - b.score);
  const byShape = results.slice(0, 12);

  // 幅度相似：涨跌幅接近，且形态也别太离谱
  const byAmp = results
    .filter(r => r.corr > 0.5)
    .slice()
    .sort((a, b) =>
      Math.abs(a.change - targetChg) - Math.abs(b.change - targetChg))
    .slice(0, 12);

  // ---- 4. 自检：复算 Top 结果，确认不是算错 ----
  const checkList = byShape.slice(0, 5);
  const selfCheck = [];
  for (const r of checkList) {
    const bars2 = await fetchKline(r.code, r.prefix, kind, lmt);
    const prices2 = bars2.map(b => b.c);
    const w2 = bestWindow(targetZ, prices2, 1, targetStruct);   // 换 step=1 更细地重算
    const consistent = w2 && Math.abs(w2.corr - r.corr) < 0.06 &&
                       w2.diff && r.diff && w2.diff.offset <= r.diff.offset + 2;
    selfCheck.push({
      code: r.code, name: r.name,
      ok: !!consistent,
      corr2: w2 ? w2.corr : 0,
      sameRange: w2 ? (Math.abs(w2.start - r.start) <= 3) : false,
    });
  }
  const allOk = selfCheck.every(s => s.ok);
  // 判定「有没有找到像的」：结构分够低，且相关性别太低
  const top = byShape[0];
  // 判定「有没有找到像的」：新评分是 0~1（越小越像），
  // 0.25 以下说明结构和对齐都很好
  const strongEnough = top.score <= 0.25;

  // ---- 5. 输出 ----
  const pct = v => (v * 100).toFixed(1) + "%";
  const sgn = v => (v > 0 ? "+" : "") + v.toFixed(1) + "%";

  const rowHtml = (r, extra) => {
    const c = r.struct, d = r.diff;
    // 结构对照：让用户看到"为什么是这只"，而不是只给一个分数
    let structLine = "";
    if (c && targetStruct && targetStruct.orderedToFall) {
      const okGap = d ? d.dGap < 0.2 : false;
      const okDrop = d ? d.dDrop < 0.25 : false;
      const okRise = d ? d.dRise < 0.3 : false;
      structLine = `
        <div class="cmp">
          见顶第 <b>${c.peakI}</b>/${targetStruct.peakI} 根 ${okGap ? "✅" : ""}
          见底第 <b>${c.troughI}</b>/${targetStruct.troughI} 根
          ${d ? `（偏离 ${d.offset} 根）` : ""}<br>
          顶前涨幅 <b>${sgn(c.rise)}</b> / 你的 ${sgn(targetStruct.rise)} ${okRise ? "✅" : ""}　
          顶到底 <b>${sgn(c.drop)}</b> / 你的 ${sgn(targetStruct.drop)} ${okDrop ? "✅" : ""}<br>
          底后反弹 <b>${sgn(c.rebound)}</b> / 你的 ${sgn(targetStruct.rebound)}
        </div>`;
    }
    return `
    <div class="res">
      <div class="tick">√</div>
      <div class="res-main">
        <div class="res-name">${esc(r.name)} <span class="ac-code">${esc(r.code)}</span></div>
        <div class="res-why">
          结构相似度 <b>${pct(Math.max(0, 1 - r.score))}</b>　
          走势相关 <b>${pct(r.corr)}</b>　
          区间涨跌 <b>${r.change > 0 ? "+" : ""}${r.change.toFixed(1)}%</b><br>
          对应区间 ${esc(r.firstDate)} ~ ${esc(r.lastDateWin)}
        </div>
        ${structLine}
        ${extra || ""}
      </div>
      <div class="res-right">
        <div class="px">${r.price.toFixed(2)}</div>
        <div class="chg flat">${esc(r.lastDate)}</div>
      </div>
    </div>`;
  };

  const checkHtml = `
    <div class="parsed" style="border-left:3px solid ${allOk ? "#30a350" : "#ffaa00"}">
      <div><span class="k">自检</span><span>
        ${allOk ? "✅ 已复算前 5 只，顶底位置和相似度都对得上"
                : "⚠️ 部分结果复算有偏差，已标注"}
      </span></div>
      <div><span class="k">样本</span><span>成功比对 ${results.length} 只，无数据 ${noData} 只</span></div>
      <div><span class="k">你的图</span><span>${L} 根，区间涨跌 ${sgn(targetChg)}${
        targetStruct && targetStruct.orderedToFall
          ? `，顶点第 ${targetStruct.peakI} 根、底点第 ${targetStruct.troughI} 根`
          : ""}</span></div>
    </div>`;

  const shapeRows = byShape.map(r => {
    const sc = selfCheck.find(s => s.code === r.code);
    const badge = sc ? (sc.ok ? "　<span style='color:var(--ok)'>已复算✓</span>"
                              : "　<span style='color:#ffaa00'>复算有偏差</span>") : "";
    return rowHtml(r, badge);
  }).join("");

  const ampRows = byAmp.map(r => rowHtml(r,
    `　幅度差 ${Math.abs(r.change - targetChg).toFixed(1)} 个百分点`)).join("");

  showAnalysis(box, strongEnough ? "ok" : "ask", `
    <div class="hd">${strongEnough ? "✅" : "🔍"} 找到 ${results.length} 只候选，最像的是 <b>${esc(top.name)}</b>（结构相似度 ${pct(Math.max(0, 1 - top.score))}）</div>
    ${checkHtml}
    ${strongEnough ? "" : `<div class="hint">⚠️ 没找到结构对得上的走势。
      下面结果只说明"都有涨有跌"，别当结论用。</div>`}

    <div style="font-weight:700;margin:14px 0 2px">一、形态最像（顶底位置 + 涨跌结构都对得上）</div>
    ${shapeRows}

    <div style="font-weight:700;margin:18px 0 2px">二、形态像 + 涨跌幅也接近</div>
    <div class="hint" style="margin-bottom:4px">
      你的图区间涨跌 ${sgn(targetChg)}，下面是幅度最接近的
    </div>
    ${ampRows || '<div class="empty">没有幅度接近的</div>'}

    <div class="hint" style="margin-top:14px">
      排序以<b>结构</b>为主：先看顶和底落在第几根、顶前涨了多少、跌了多少、底后反弹多少；
      再看整体走势相关度。<br>
      为什么不用相关系数排第一位：实测过一张「尖顶+急速深跌」的图，
      相关系数最高的那只（91.6%）顶前只涨了 33%，而原图涨了 72% —— 上涨段差一倍。
      相关系数看不出这种结构差异，所以只当辅助。<br>
      这个结果只反映历史走势像不像，<b>不代表未来会涨会跌</b>。
    </div>
  `);
}
