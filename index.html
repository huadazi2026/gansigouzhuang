(function initVisionUI() {
  const drop = $("dropZone");
  const input = $("imgInput");
  if (!drop || !input) return;

  drop.addEventListener("click", () => input.click());
  input.addEventListener("change", () => {
    const f = input.files && input.files[0];
    if (f) onPick(f);
  });

  ["dragenter", "dragover"].forEach(ev =>
    drop.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      drop.classList.add("hover");
    }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      drop.classList.remove("hover");
    }));
  drop.addEventListener("drop", e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) onPick(f);
  });

  // 直接 Ctrl+V 粘贴截图，这是最快的用法
  document.addEventListener("paste", e => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (const it of items) {
      if (it.type && it.type.indexOf("image") === 0) {
        const f = it.getAsFile();
        if (f) {
          e.preventDefault();
          onPick(f);
          $("askText").scrollIntoView({ behavior: "smooth", block: "center" });
        }
        return;
      }
    }
  });

  function onPick(file) {
    const nameEl = $("fileName");
    if (nameEl) nameEl.textContent = "已选择：" + (file.name || "剪贴板图片");
    // 走图片流程时，才显示"周期 / 扫描范围"这两个参数
    $("imgOpts").style.display = "flex";
    $("askText").value = "";
    $("askBtn").scrollIntoView({ behavior: "smooth", block: "center" });
    analyzeImage(file);
  }
})();

/* ==========================================================================
   五之二、语音输入（按住说话）
   --------------------------------------------------------------------------
   用浏览器内置的 Web Speech API，不需要任何额外的语音服务或密钥。

   有个硬性前提：**必须是安全上下文**才能调麦克风。也就是
   localhost / 127.0.0.1 / https，三种之一。
   用局域网 IP + http 访问（比如手机上 http://192.168.1.5:8848）
   浏览器会直接拒绝，这时要把原因说清楚，而不是让按钮点了没反应。
   ========================================================================== */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function micSecureOK() {
  // file:// 和 http://局域网IP 都不算安全上下文
  return window.isSecureContext === true;
}

(function initVoice() {
  const btn = $("micBtn");
  const label = $("micLabel");
  const ta = $("askText");
  if (!btn || !ta) return;

  // 不支持 / 不安全 → 按钮禁用并说明原因，不让用户白按
  if (!SR || !micSecureOK()) {
    btn.classList.add("unsupported");
    btn.disabled = true;
    if (!SR) {
      label.textContent = "这个浏览器不支持语音输入";
    } else {
      label.textContent = "语音需要 localhost 或 https 才能用";
      btn.title = "浏览器只在安全上下文（localhost / https）下允许用麦克风。" +
                  "在电脑上用 http://127.0.0.1:8848 打开就能用；" +
                  "手机用局域网 IP 的 http 地址打开会被浏览器拒绝。";
    }
    return;
  }

  let rec = null;
  let listening = false;
  let baseText = "";        // 开始说话前输入框里已有的内容
  let finalText = "";       // 本次已确认的文字

  function start() {
    if (listening) return;
    rec = new SR();
    rec.lang = "zh-CN";
    rec.continuous = true;
    rec.interimResults = true;      // 边说边出字，用户能看到识别效果
    rec.maxAlternatives = 1;

    baseText = ta.value;
    finalText = "";
    listening = true;
    btn.classList.add("listening");
    label.textContent = "松手结束";

    rec.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript;
        else interim += r[0].transcript;
      }
      // 已确认的 + 临时识别片段一起显示，用户能实时看到识别效果
      ta.value = baseText + finalText + interim;
    };

    rec.onerror = e => {
      const map = {
        "not-allowed": "麦克风权限被拒绝了。点地址栏左边的图标允许麦克风，或用 127.0.0.1 打开。",
        "service-not-allowed": "浏览器禁止了语音识别服务。",
        "audio-capture": "没检测到麦克风设备。",
        "no-speech": "没听到声音，再试一次。",
        "network": "语音识别需要联网，检查一下网络。",
        "aborted": "",
      };
      const msg = map[e.error];
      if (msg) toast(msg, "err");
      else if (e.error) toast("语音识别出错：" + e.error, "err");
      stop(true);
    };

    rec.onend = () => {
      // continuous 模式下浏览器仍可能自动断开，这里不自动重启，
      // 保持"松手即停"的可预期行为
      if (listening) stop(false);
    };

    try {
      rec.start();
    } catch (e) {
      listening = false;
      btn.classList.remove("listening");
      label.textContent = "按住说话";
      toast("启动语音失败：" + e.message, "err");
    }
  }

  function stop(fromError) {
    if (!listening) return;
    listening = false;
    btn.classList.remove("listening");
    label.textContent = "按住说话";
    try { rec && rec.stop(); } catch (e) { /* 忽略 */ }
    rec = null;
    if (!fromError) {
      const added = ta.value.length - baseText.length;
      if (added > 0) toast("已识别 " + added + " 个字", "ok");
      else toast("没听清，再说一次试试", "err");
    }
  }

  // 按住说话、松手结束。
  // 同时绑鼠标和触摸事件：手机上必须先 preventDefault，
  // 否则长按会弹出系统的文本选择菜单，把输入框搞乱。
  const down = e => {
    if (e && e.cancelable) e.preventDefault();
    start();
  };
  const up = e => {
    if (e && e.cancelable) e.preventDefault();
    stop(false);
  };

  btn.addEventListener("mousedown", down);
  btn.addEventListener("mouseup", up);
  btn.addEventListener("mouseleave", e => { if (listening) stop(false); });
  btn.addEventListener("touchstart", down, { passive: false });
  btn.addEventListener("touchend", up, { passive: false });
  btn.addEventListener("touchcancel", up, { passive: false });
  // 键盘可达性：空格/回车也能用（按一下开始，再按一下结束）
  btn.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      listening ? stop(false) : start();
    }
  });
  // 阻止长按弹出上下文菜单
  btn.addEventListener("contextmenu", e => e.preventDefault());
})();

/* ==========================================================================
   六、下拉提示
   ========================================================================== */

let acIndex = -1, acHits = [];
let acSelecting = false;

function searchStocks(q) {
  const qRaw = q.trim();
  let s = qRaw.toLowerCase();
  if (!s) return [];
  const pfx = s.match(/^(sh|sz|bj)(\d{3,6})$/);
  if (pfx) s = pfx[2];
  const digits = /^\d+$/.test(s);
  const hits = [];
  for (let i = 0; i < STOCKS.length; i++) {
    const row = STOCKS[i];
    const code = row[0], name = row[1], py = row[3], hot = row[4] || 0;
    const pyFull = row[5] || "";      // 全拼，老数据没有这个字段就跳过
    let score = -1;
    if (digits) {
      if (code === s) score = 100;
      else if (code.startsWith(s)) score = 70;
      else if (code.includes(s)) score = 30;
    } else {
      const q = qRaw;
      if (name === q) score = 100;
      // 全拼优先于首字母：用户打 maotai 比打 gzmt 更自然
      else if (pyFull && pyFull === s) score = 92;
      else if (pyFull && pyFull.startsWith(s)) score = 90;
      else if (py && py.startsWith(s)) score = 88;
      else if (name.startsWith(q)) score = 85;
      else if (name.includes(q)) score = 55;
      else if (pyFull && pyFull.includes(s)) score = 40;
      else if (py && py.includes(s)) score = 25;
    }
    if (score > 0) {
      hits.push({ code, name, prefix: row[2], score: score + hot });
      if (hits.length > 400) break;
    }
  }
  hits.sort((a, b) => b.score - a.score || a.code.localeCompare(b.code));
  return hits.slice(0, 12);
}

function renderAc(list) {
  const box = $("acList");
  acHits = list; acIndex = -1;
  if (!list.length) { box.className = "ac-list"; box.innerHTML = ""; return; }
  box.innerHTML = list.map((s, i) =>
    `<div class="ac-item" data-i="${i}">
       <span class="ac-name">${esc(s.name)}</span>
       <span class="ac-code">${esc(s.code)} · ${esc(s.prefix.toUpperCase())}</span>
     </div>`).join("");
  box.className = "ac-list on";
  box.querySelectorAll(".ac-item").forEach(el => {
    const pick = e => {
      if (e && e.cancelable) e.preventDefault();
      if (e && e.stopPropagation) e.stopPropagation();
      chooseAc(+el.dataset.i);
    };
    el.addEventListener("pointerdown", pick);
    el.addEventListener("mousedown", pick);
    el.addEventListener("touchstart", pick, { passive: false });
  });
}

function closeAc() { $("acList").className = "ac-list"; acIndex = -1; }

function chooseAc(i) {
  const s = acHits[i];
  if (!s) return;
  acSelecting = true;
  picked = { code: s.code, name: s.name, prefix: s.prefix };
  $("code").value = s.code;
  closeAc();
  showPicked();
  try { $("value").focus(); } catch (e) {}
  setTimeout(() => { acSelecting = false; }, 300);
}

function showPicked() {
  const box = $("picked");
  if (!picked) { box.className = "picked"; box.innerHTML = ""; return; }
  box.className = "picked on";
  box.innerHTML = `<span class="dot"></span><b>${esc(picked.name)}</b>
    <span class="ac-code">${esc(picked.code)}</span>
    <button class="x" id="clearPick" title="清除">×</button>`;
  $("clearPick").addEventListener("click", () => {
    picked = null; $("code").value = ""; showPicked(); closeAc(); $("code").focus();
  });
}

/* ==========================================================================
   七、记录：存储、校验、渲染
   ========================================================================== */

function readStore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function writeStore(list) { localStorage.setItem(LS_KEY, JSON.stringify(list)); }

/** 写完读回，逐字段核对（需求里的"后台测试是否真保存完成"） */
function verifySaved(id) {
  let arr;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return { ok: false, why: "存储里没有数据" };
    arr = JSON.parse(raw);
  } catch (e) { return { ok: false, why: "存储内容无法解析" }; }
  if (!Array.isArray(arr)) return { ok: false, why: "存储格式不对" };
  const hit = arr.find(r => r.id === id);
  if (!hit) return { ok: false, why: "写进去又没读回来" };
  for (const k of ["code", "name", "type", "dir", "value"]) {
    if (hit[k] === undefined || hit[k] === null || hit[k] === "") {
      return { ok: false, why: "字段 " + k + " 丢失" };
    }
  }
  return { ok: true, record: hit, total: arr.length };
}

function storageHealth() {
  try {
    const probe = "__p__" + Date.now();
    localStorage.setItem(probe, "1");
    const ok = localStorage.getItem(probe) === "1";
    localStorage.removeItem(probe);
    return ok;
  } catch (e) { return false; }
}

function condText(r) {
  return ruleSummary({ type: r.type, dir: r.dir, value: Number(r.value) });
}

/** 保存入口：写完读回校验，通过后自动交给后台盯盘 */
async function saveRecord(rec) {
  // 去重
  const dup = records.find(r => r.code === rec.code && r.type === rec.type &&
    r.dir === rec.dir && Math.abs(Number(r.value) - Number(rec.value)) < 1e-9);
  if (dup) {
    toast(`这条已经有了：\n${dup.name}　${condText(dup)}`, "err");
    return false;
  }
  const full = {
    id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    code: rec.code, name: rec.name, prefix: guessPrefix(rec.code),
    type: rec.type, dir: rec.dir, value: Number(rec.value),
    note: rec.note || "", createdAt: Date.now(),
  };
  try {
    writeStore(records.concat([full]));
    const check = verifySaved(full.id);
    if (!check.ok) throw new Error(check.why);
    records = readStore();
    render();
    toast(`${check.record.name}　${condText(check.record)}\n设置提醒完成 ✓\n（已保存 ${check.total} 条，校验通过）`, "ok");
    updateSaveState();
    // 保存即交给后台盯盘：同步提醒并确保监控在跑（用户不用管这件事）
    syncAlertsToMonitor(true);
    return true;
  } catch (e) {
    records = readStore();
    render();
    toast("保存失败：" + (e && e.message ? e.message : e) +
          "\n可能原因：浏览器存储被禁用或已满", "err");
    return false;
  }
}

/* ---------------- 手动保存 ---------------- */
$("saveBtn").addEventListener("click", async () => {
  const btn = $("saveBtn");
  if (!picked) {
    const typed = $("code").value.trim();
    if (/^\d{6}$/.test(typed)) {
      toast("请先在下拉提示里选中这只股票\n（确认名称没选错）", "err");
      $("code").focus();
      return;
    }
    toast("请输入股票代码，并在下拉提示里选一只", "err");
    $("code").focus();
    return;
  }
  const type = $("type").value;
  const dir = $("dir").value;
  let value = parseFloat(String($("value").value).replace(/[%％,，\s]/g, ""));
  if (!isFinite(value)) {
    toast("请填触发" + (type === "pct" ? "涨跌幅" : "价格") + "\n例如 " + (type === "pct" ? "-3" : "1300"), "err");
    $("value").focus();
    return;
  }
  if (type === "pct") {
    if (dir === "down" && value > 0) value = -value;
    if (dir === "up" && value < 0) value = Math.abs(value);
  } else if (value <= 0) {
    toast("价格要大于 0", "err");
    $("value").focus();
    return;
  }

  btn.disabled = true; btn.textContent = "保存中…";
  await new Promise(r => setTimeout(r, 100));
  const ok = await saveRecord({
    code: picked.code, name: picked.name, type, dir, value,
    note: $("note").value.trim(),
  });
  if (ok) resetForm();
  btn.disabled = false; btn.textContent = "保 存";
});

function resetForm() {
  picked = null;
  $("code").value = ""; $("value").value = ""; $("note").value = "";
  $("dir").value = "up";
  $("type").value = "price";
  $("type").dispatchEvent(new Event("change"));
  showPicked(); closeAc();
  $("code").focus();
}

function delRecord(id) {
  const rec = records.find(r => r.id === id);
  if (!rec) return;
  if (!confirm(`删除这条提醒？\n\n${rec.name}　${condText(rec)}`)) return;
  writeStore(records.filter(r => r.id !== id));
  records = readStore();
  render(); updateSaveState();
  syncAlertsToMonitor(true);       // 删到没提醒时，后台会自动停，别空转
  toast("已删除", "ok");
}

function render() {
  const box = $("list");
  $("count").textContent = records.length ? `共 ${records.length} 条` : "";
  // 折叠时右边那行小字要跟着条数更新（没记录就不提示"点这里展开"）
  const hint = $("foldHint");
  if (hint && $("recToggle").classList.contains("closed")) {
    hint.textContent = records.length ? "点这里展开" : "";
  }
  if (!records.length) {
    box.innerHTML = `<div class="empty">还没有记录<br>在上面「A 添加提醒」里选一只股票、填个条件，<br>点保存就会自动开始盯盘</div>`;
    return;
  }
  box.innerHTML = records.slice().reverse().map(r => `
    <div class="rec" data-id="${esc(r.id)}">
      <div class="rec-main">
        <div class="rec-name">${esc(r.name)}<span class="rec-code">${esc(r.code)}</span></div>
        <div class="rec-cond">${esc(condText(r))}${r.note ? "　·　" + esc(r.note) : ""}</div>
        <div class="rec-time">添加于 ${esc(fmtTime(r.createdAt))}</div>
      </div>
      <div class="rec-right">
        <div class="px" data-px="${esc(r.code)}">—</div>
        <div class="chg" data-chg="${esc(r.code)}"></div>
      </div>
      <button class="del" data-del="${esc(r.id)}" title="删除">×</button>
    </div>`).join("");
  box.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", () => delRecord(b.dataset.del)));
  fillPrices();
}

function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let filling = false;
async function fillPrices() {
  if (filling) return;
  // 收起时列表是 hidden，拉了也看不见，白费一次网络请求
  const body = $("recBody");
  if (body && body.style.display === "none") return;

  const codes = [...new Set(records.map(r => r.code))];
  if (!codes.length) return;
  filling = true;
  try {
    const q = await fetchMany(codes);
    codes.forEach(code => {
      const px = document.querySelector(`[data-px="${code}"]`);
      const chg = document.querySelector(`[data-chg="${code}"]`);
      if (!px) return;
      const d = q[code];
      if (!d) { px.textContent = "—"; if (chg) chg.textContent = "取不到行情"; return; }
      px.textContent = d.price.toFixed(2);
      if (chg) {
        const cls = d.change > 0 ? "up" : (d.change < 0 ? "down" : "flat");
        chg.className = "chg " + cls;
        chg.textContent = `${d.change > 0 ? "▲" : (d.change < 0 ? "▼" : "─")}${d.changePct.toFixed(2)}%`;
      }
    });
  } finally { filling = false; }
}

function updateSaveState() {
  const healthy = storageHealth();
  $("saveDot").className = "dot" + (healthy ? "" : " off");
  $("saveState").textContent = healthy
    ? `存储正常，已保存 ${records.length} 条记录`
    : "浏览器存储不可用，保存会失败";
}

/* ---------------- 提醒记录的折叠 ----------------
   默认收起，只留标题和条数，省得把上面「添加提醒」挤下去。
   展开状态记在 localStorage 里，下次打开保持用户的选择。
   ------------------------------------------------------------------ */

const FOLD_KEY = "stock_alert_records_open";

function setRecordsFold(open, save) {
  const head = $("recToggle");
  const body = $("recBody");
  if (!head || !body) return;

  head.classList.toggle("closed", !open);
  head.setAttribute("aria-expanded", open ? "true" : "false");
  body.style.display = open ? "" : "none";
  $("foldHint").textContent = open ? "" : (records.length ? "点这里展开" : "");

  if (save) {
    try { localStorage.setItem(FOLD_KEY, open ? "1" : "0"); } catch (e) { /* 忽略 */ }
  }
  // 展开时才值得去拉行情（收起时列表是 hidden，拉了也看不见）
  if (open) fillPrices();
}

function initRecordsFold() {
  let open = false;                     // 默认收起
  try {
    const saved = localStorage.getItem(FOLD_KEY);
    if (saved !== null) open = saved === "1";
  } catch (e) { /* 存储不可用时就用默认值 */ }

  setRecordsFold(open, false);

  const head = $("recToggle");
  head.addEventListener("click", () => {
    setRecordsFold(head.classList.contains("closed"), true);
  });
  // 键盘可达：回车/空格也能展开收起
  head.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      setRecordsFold(head.classList.contains("closed"), true);
    }
  });
}

/* ==========================================================================
   八、按钮与事件
   ========================================================================== */

$("refreshBtn").addEventListener("click", async () => {
  toast("正在刷新行情…");
  await fillPrices();
  toast("行情已更新", "ok");
});

$("copyBtn").addEventListener("click", async () => {
  if (!records.length) { toast("还没有记录可复制", "err"); return; }
  const cfg = { alerts: records.map(r => ({ code: r.code, type: r.type, dir: r.dir, value: r.value, note: r.note || r.name })) };
  const text = JSON.stringify(cfg, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    toast(`已复制 ${records.length} 条配置\n可粘到电脑版 config.json`, "ok");
  } catch (e) { prompt("复制下面的内容：", text); }
});

let acTimer = null;
$("code").addEventListener("input", () => {
  const v = $("code").value;
  if (picked && v !== picked.code) { picked = null; showPicked(); }
  clearTimeout(acTimer);
  acTimer = setTimeout(() => {
    renderAc(searchStocks(v));
    if (/^\d{6}$/.test(v.trim()) && !picked) {
      const hit = STOCKS.find(s => s[0] === v.trim());
      if (hit) { picked = { code: hit[0], name: hit[1], prefix: hit[2] }; showPicked(); }
    }
  }, 90);
});

$("code").addEventListener("keydown", e => {
  const box = $("acList");
  const open = box.className.includes("on");
  if (e.key === "ArrowDown" && open) { e.preventDefault(); acIndex = Math.min(acIndex + 1, acHits.length - 1); }
  else if (e.key === "ArrowUp" && open) { e.preventDefault(); acIndex = Math.max(acIndex - 1, 0); }
  else if (e.key === "Enter") {
    if (open && acIndex >= 0) { e.preventDefault(); chooseAc(acIndex); return; }
    if (open && acHits.length) { e.preventDefault(); chooseAc(0); return; }
    if (picked) { e.preventDefault(); $("value").focus(); }
    return;
  } else if (e.key === "Escape") { closeAc(); return; }
  box.querySelectorAll(".ac-item").forEach((el, i) => el.classList.toggle("sel", i === acIndex));
});

$("code").addEventListener("blur", () => {
  setTimeout(() => { if (!acSelecting) closeAc(); }, 180);
});

$("value").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("saveBtn").click(); } });

/* ---------------- 多行输入框的快捷键 ----------------
   需求：Enter 必须是换行，不能拿去当提交 —— 否则没法写多行条件。
   提交改用 Ctrl+Enter（Mac 上 Cmd+Enter 也行）。

   两个容易出事的点：
   1) 中文输入法打字时也会触发 keydown，必须避开（isComposing / keyCode 229），
      否则选字时按 Enter 会误提交。
   2) 只在按了 Ctrl/Cmd 时才拦截，其余情况一律放行，让浏览器插入换行。
   ------------------------------------------------------------------ */
function bindMultilineSubmit(el, action) {
  el.addEventListener("keydown", e => {
    if (e.isComposing || e.keyCode === 229) return;      // 输入法组合中，交给输入法
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      action();
    }
    // Enter（无修饰键）不做任何事 → 浏览器默认插入换行
  });
}

bindMultilineSubmit($("askText"), () => $("askBtn").click());

$("type").addEventListener("change", () => {
  const isPct = $("type").value === "pct";
  $("valLabel").textContent = isPct ? "触发涨跌幅（%）" : "触发价格（元）";
  $("value").placeholder = isPct ? "例如 -3 表示跌 3%" : "例如 1300";
  $("valHint").textContent = isPct ? "填正数会自动按方向补符号，跌 3% 填 3 即可" : "";
});
$("type").dispatchEvent(new Event("change"));

/* ==========================================================================
   九、后台推送接口（手机版为占位）

   手机版没有本地服务器：提醒存在这台设备的浏览器里，盯盘和推送由电脑上的
   桌面版负责。所以这里把所有后台调用换成一个必定失败的实现 —— 函数签名
   保持不变，上层逻辑一行都不用改，天然走「后台不可用」的降级分支。
   ========================================================================== */

let monAvailable = null;        // null=还没探测过；false=后台没连上
let monTimer = null;

async function monFetch(path, body) {
  // 手机版：没有本地后台，直接抛错，让上层走降级分支（不弹错误）
  throw new Error("no-local-backend");
}

/** 在「提醒记录」那栏显示一行监控状态（不显眼，出问题才突出） */
function renderMonLine(text, warn) {
  const el = $("monLine");
  if (!el) return;
  el.textContent = text || "";
  el.style.color = warn ? "#ffaa00" : "var(--sub)";
}

/** 把当前提醒同步给后台；有提醒就确保监控在跑，没提醒就停掉 */
async function syncAlertsToMonitor(silent) {
  try {
    const payload = records.map(r => ({
      code: r.code, name: r.name, type: r.type, dir: r.dir,
      value: Number(r.value), note: r.note || "",
    }));
    const r = await monFetch("/alerts", { alerts: payload });
    if (!r || !r.ok) throw new Error((r && r.message) || "同步失败");
    monAvailable = true;

    // 有提醒就保证监控在跑；删光了就停，别空转
    if (records.length > 0) {
      const st = await monFetch("/start", { interval: 20 });
      const paused = st.pausedReason ? `（${st.pausedReason}自动休眠，开盘自动开始）` : "";
      renderMonLine(`盯盘中：${records.length} 条提醒已交给后台，关掉网页也会推送到手机${paused}`);
    } else {
      await monFetch("/stop", {});
      renderMonLine("没有提醒，后台已暂停");
    }
    return r;
  } catch (e) {
    if (monAvailable !== false || !silent) {
      monAvailable = false;
      renderMonLine("手机版：提醒存在这台设备上；盯盘和推送在电脑那边跑", false);
    }
    return null;
  }
}

/** 静默刷新那一行状态（不打断用户） */
async function refreshMon(silent) {
  try {
    const st = await monFetch("/status");
    monAvailable = true;
    const paused = st.pausedReason ? `，当前${st.pausedReason}休眠中` : "";
    const fired = st.triggeredCount ? `，今日已推 ${st.triggeredCount} 条` : "";
    const chans = (st.channels || []).join("/") || "无推送通道";
    renderMonLine(st.running
      ? `盯盘中：${st.alertCount} 条提醒${paused}${fired}　通道 ${chans}`
      : (records.length ? "提醒已保存，后台监控未运行" : "还没有提醒"));
    if (!monTimer) {
      monTimer = setInterval(() => {
        if (document.visibilityState === "visible") refreshMon(true);
      }, 5000);
    }
    return st;
  } catch (e) {
    monAvailable = false;
    renderMonLine("手机版：提醒存在这台设备上；盯盘和推送在电脑那边跑", false);
    return null;
  }
}

/* 「测试推送」优先走后端（后端发的才是真实推送链路），
   后端不可用时退回浏览器直发。 */
$("testBtn").addEventListener("click", async () => {
  if (monAvailable !== false) {
    toast("正在通过后台测试推送…");
    try {
      const r = await monFetch("/testpush", {});
      toast(r.message || (r.ok ? "已发送" : "发送失败"), r.ok ? "ok" : "err");
      await refreshMon(true);
      return;
    } catch (e) { /* 落到浏览器直发 */ }
  }
  toast("正在测试推送（浏览器直发）…");
  try {
    const r = await fetch("https://api.day.app/6ZGDLHHGUiVM52y9F3uL8P/" +
      encodeURIComponent("干死狗庄 · 到价提醒测试") + "/" +
      encodeURIComponent("收到这条说明推送通了"));
    const j = await r.json().catch(() => null);
    if (j && j.code === 200) toast("已发送，去看看手机", "ok");
    else toast("推送返回异常：" + JSON.stringify(j).slice(0, 80), "err");
  } catch (e) {
    toast("推送失败：" + e.message + "\n（浏览器直连可能被拦，用启动.bat 打开更准）", "err");
  }
});

/* ---------------- 启动 ----------------
   顺序很重要：**先把提醒同步给后台，再读状态**。
   反过来的话，状态行会显示同步前的旧数字（实测踩过）。
   ------------------------------------------------------------------ */
(async function init() {
  records = readStore();
  if (!STOCKS.length) toast("股票清单没加载出来（stocks.js 缺失）", "err");
  updateSaveState();
  render();
  // 放在 render 之后：折叠提示要根据已有条数来决定显不显示
  initRecordsFold();

  const r = await syncAlertsToMonitor(true);   // 顺带探测后台是否可用
  if (r) await refreshMon(true);
})();
</script>
